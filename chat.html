<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate"><!-- 크롬 「페이지 번역」 끄기 — 번역은 이 페이지가 글마다 따로 한다(크롬 번역 창 · 「번역 사용 중지」 알림이 뜨지 않게) -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOVEAPPS 채팅</title>
<style>
/* 디스코드 느낌: 왼쪽 방 목록 · 가운데 대화(말풍선 없이 줄마다 동그라미 얼굴 · 이름 · 시각) · 아래 둥근 입력칸 */
:root{--rail:#1e1f22;--side:#2b2d31;--main:#313338;--input:#383a40;--hover:#2e3035;--line:#1f2023;--text:#dbdee1;--sub:#949ba4;--head:#f2f3f5;--blurple:#5865f2;--green:#23a559;--red:#f23f43}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--main);color:var(--text);font:15px/1.375 "gg sans","Noto Sans KR","Malgun Gothic","Microsoft JhengHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;height:100dvh}
#side{width:240px;flex:none;background:var(--side);display:flex;flex-direction:column}
#side .srv{height:48px;display:flex;align-items:center;padding:0 16px;font-weight:700;color:var(--head);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .cat{display:flex;align-items:center;justify-content:space-between;padding:18px 8px 4px 16px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--sub);text-transform:uppercase}
#side .cat button{background:none;border:0;color:var(--sub);font-size:20px;line-height:1;cursor:pointer;padding:0 6px}
#side .cat button:hover{color:var(--head)}
#rooms{flex:1;overflow:auto;padding:0 8px}
.room{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;margin:1px 0;border:0;border-radius:4px;background:none;color:var(--sub);cursor:pointer;text-align:left;font-size:15px}
.room:hover{background:var(--hover);color:var(--text)}
.room.on{background:#404249;color:var(--head)}
.room .h{font-size:20px;opacity:.7;width:20px;text-align:center}
.room span.nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .cnt{display:block;font-size:11px;color:var(--sub);line-height:1.2}
#me{height:52px;background:#232428;display:flex;align-items:center;gap:8px;padding:0 8px}
#me .av{width:32px;height:32px;font-size:14px}
#me .who{flex:1;min-width:0;cursor:pointer}
#me .who b{display:block;color:var(--head);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#me .who small{color:var(--red);font-size:12px}
#me select{background:var(--input);border:0;border-radius:4px;padding:4px;color:var(--text);max-width:96px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.2);color:var(--head);font-weight:700}
#top .h{font-size:20px;color:var(--sub);font-weight:400}
#top .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top a,#burger{color:var(--sub);text-decoration:none;background:none;border:0;font-size:20px;cursor:pointer}
#burger{display:none}
#log{flex:1;overflow:auto;padding:16px 0 8px}
.msg{display:flex;gap:16px;padding:2px 16px;margin-top:17px}
.msg.cont{margin-top:0}
.msg:hover{background:var(--hover)}
.av{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.msg.cont .av{visibility:hidden;height:0}
.av{background-size:cover;background-position:center}
.av.pic1{color:transparent}
.pic{margin:4px 0 2px;max-width:min(420px,100%);min-height:40px;color:var(--sub)}
.pic img{display:block;max-width:100%;max-height:360px;border-radius:8px;cursor:zoom-in}
#clip{background:none;border:0;color:var(--sub);font-size:20px;padding:6px;cursor:pointer}
#clip:hover,#mic:hover{color:var(--head)}
.room .own{font-size:12px}
.msg{position:relative}
.mrep{position:absolute;right:56px;top:-6px;display:none;background:#2b2d31;border:1px solid #1f2023;border-radius:6px;padding:2px 6px;cursor:pointer;font-size:14px;color:var(--text)}
.msg:hover .mrep,.msg:focus-within .mrep,.msg.sel .mrep,.msg.sel .mdel{display:block}
.msg.sel{background:var(--hover)}
.msg{-webkit-touch-callout:none}
.msg:not(:has(.mdel)) .mrep{right:16px}
.rep{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin:0 0 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep b{color:var(--text);font-weight:600}
.rep:hover{color:var(--text)}
.msg.flash{background:rgba(88,101,242,.18);transition:background 1.2s}
#rbar{display:none;align-items:center;gap:8px;background:#2b2d31;border-radius:8px 8px 0 0;padding:6px 12px;font-size:13px;color:var(--sub)}
#rbar.on{display:flex}
#rbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rbar b{color:var(--text)}
#rbar button{background:none;border:0;color:var(--sub);font-size:16px;cursor:pointer}
#rbar.on + .box{border-radius:0 0 8px 8px}
.mdel{position:absolute;right:16px;top:-6px;display:none;background:#2b2d31;border:1px solid #1f2023;border-radius:6px;padding:2px 6px;cursor:pointer;font-size:14px}
.msg:hover .mdel,.msg:focus-within .mdel{display:block}
@media (hover:none){.mdel,.mrep{display:block}}
.body{min-width:0;flex:1}
.hd{display:flex;align-items:baseline;gap:8px}
.hd b{font-weight:600}
.hd .tm{font-size:12px;color:var(--sub)}
.hd .lg{font-size:10px;padding:0 5px;border-radius:3px;background:#4e5058;color:#dbdee1;font-weight:700}
.msg.cont .hd{display:none}
.tx{white-space:pre-wrap;word-break:break-word}
/* 원문이 위, 내가 고른 언어 번역이 아래(이박사님 11-09) */
.org{white-space:pre-wrap;word-break:break-word;color:#a5b4fc;font-size:14px;margin-top:2px;padding-left:8px;border-left:2px solid #5865f2}
.org.fail{color:var(--sub);border-left-color:#4e5058}
.wait{color:var(--sub);font-style:italic}
.day{display:flex;align-items:center;gap:8px;margin:20px 16px 4px;color:var(--sub);font-size:12px;font-weight:600}
.day:before,.day:after{content:"";flex:1;height:1px;background:#3f4147}
.empty{color:var(--sub);text-align:center;margin-top:40px}
.sys{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 72px;margin-top:8px;color:var(--sub);font-size:14px}
.sys:before{content:"→";color:var(--green);font-weight:700}
.sys.out:before{content:"←";color:var(--red)}
#bar{padding:0 16px calc(20px + env(safe-area-inset-bottom))}
#bar .box{display:flex;align-items:flex-end;background:var(--input);border-radius:8px;padding:0 6px 0 16px}
#msg{flex:1;background:none;border:0;outline:none;resize:none;padding:11px 0;max-height:200px;height:44px}
#msg::placeholder{color:#6d6f78}
#send{background:none;border:0;color:var(--sub);font-size:20px;padding:8px 10px;cursor:pointer}
#send:hover,#emo:hover{color:var(--head)}
#emo{background:none;border:0;color:var(--sub);font-size:22px;padding:6px 6px;cursor:pointer;filter:grayscale(1);transition:filter .15s,transform .15s}
#emo:hover,#emo.on{filter:none;transform:scale(1.15)}
#bar{position:relative}
#mic{background:none;border:0;color:var(--sub);font-size:20px;padding:6px;cursor:pointer}
#mic.on{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.play{background:#2b2d31;border:1px solid #3f4147;color:var(--head);border-radius:16px;padding:4px 12px;margin:2px 0 3px;cursor:pointer;font-weight:600}
.play:hover{background:#404249}
#vbtn{background:none;border:1px solid #4e5058;color:var(--text);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
#vbtn.on{background:var(--red);border-color:var(--red);color:#fff}
#vpanel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#2b2d31;border-bottom:1px solid var(--line)}
#vpanel[hidden]{display:none}
#caps{padding:0 12px;background:#2b2d31}
#caps:empty{display:none}
.cap{font-size:13px;color:#e3e5e8;padding:3px 0;border-bottom:1px solid #232428;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap.mine{color:var(--sub)}
.vp{display:inline-flex;align-items:center;gap:6px;background:#383a40;border-radius:12px;padding:3px 10px;font-size:13px}
.vp i{width:8px;height:8px;border-radius:50%;background:#80848e}
.vp.ok i{background:var(--green)}
.vp.mute i{background:var(--red)}
.vtool{margin-left:auto;background:#383a40;border:0;border-radius:12px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--text)}
#pick{position:absolute;right:16px;bottom:calc(100% + 4px);width:min(352px,calc(100vw - 32px));max-height:300px;overflow:auto;background:#2b2d31;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:8px;display:none;z-index:4}
#pick.on{display:block}
#pick .cat2{font-size:12px;font-weight:700;color:var(--sub);margin:6px 4px 4px}
#pick .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
#pick button{background:none;border:0;border-radius:4px;font-size:24px;line-height:1;padding:6px 0;cursor:pointer}
#pick button:hover{background:#404249}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.card{background:var(--main);border-radius:8px;width:100%;max-width:440px;padding:24px 16px 16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h2{margin:0 0 6px;text-align:center;color:var(--head);font-size:22px}
.card p{margin:0 0 16px;text-align:center;color:var(--sub);font-size:14px}
.card label{display:block;font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase;margin:12px 0 6px}
.card input,.card select{width:100%;background:var(--rail);border:0;border-radius:4px;padding:10px;outline:none}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{border:0;border-radius:4px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--blurple);color:#fff}
.btn.ghost{background:none;color:var(--text)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
@media (max-width:720px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:5;transform:translateX(-100%);transition:transform .2s}
  #app.open #side{transform:none;box-shadow:4px 0 16px rgba(0,0,0,.5)}
  #burger{display:block}
  .msg{gap:12px;padding:2px 12px}
  .av{width:36px;height:36px}
}
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <div class="srv">LOVEAPPS</div>
    <div class="cat"><span id="cT"></span><button id="addRoom" title="+">＋</button></div>
    <div id="rooms"></div>
    <div id="me"><div class="av" id="meAv"></div><div class="who" id="meWho"><b id="meN"></b><small id="mode"></small></div><select id="lang" aria-label="language"></select></div>
  </nav>
  <main id="main">
    <div id="top"><button id="burger" aria-label="menu">☰</button><span class="h" id="topH">#</span><span class="t" id="topT"></span><span id="here" style="color:var(--sub);font-size:13px;font-weight:600;white-space:nowrap"></span><button id="delRoom" hidden title="delete" style="background:none;border:0;font-size:18px;cursor:pointer">🗑</button><button id="vbtn"></button><button id="bell" aria-label="sound" style="background:none;border:0;font-size:18px;cursor:pointer">🔔</button><a href="./" title="k700">⌂</a></div>
    <div id="vpanel" hidden></div>
    <div id="caps"></div>
    <div id="log"></div>
    <div id="bar"><div id="rbar"><span id="rbarT"></span><button id="rbarX" aria-label="cancel">✕</button></div><div class="box"><textarea id="msg" maxlength="1000" rows="1"></textarea><button id="clip" aria-label="attach">📎</button><input id="file" type="file" accept="image/*" multiple hidden><button id="mic" aria-label="voice message">🎤</button><button id="emo" aria-label="emoji">😀</button><button id="send" aria-label="send">➤</button></div><div id="pick"></div></div>
  </main>
</div>

<div class="modal" id="mJoin"><div class="card">
  <h2 id="jT"></h2><p id="jD"></p>
  <label id="jNL"></label><input id="jName" maxlength="40" autocomplete="nickname">

  <div class="row"><button class="btn" id="jGo"></button></div>
</div></div>

<div class="modal" id="mNew"><div class="card">
  <h2 id="nT"></h2><p id="nD"></p>
  <label id="nNL"></label><input id="nName" maxlength="30">
  <label id="nPL"></label><input id="nPw" type="password" maxlength="40" autocomplete="new-password">

  <div class="err" id="nErr"></div>
  <div class="row"><button class="btn ghost" id="nNo"></button><button class="btn" id="nGo"></button></div>
</div></div>

<div class="modal" id="big" style="cursor:zoom-out"><img alt="" style="max-width:96vw;max-height:92vh;border-radius:6px"></div>

<div class="modal" id="mPw"><div class="card">
  <h2 id="pT"></h2><p id="pD"></p>
  <label id="pPL"></label><input id="pPw" type="password" maxlength="40" autocomplete="current-password">
  <div class="err" id="pErr"></div>
  <div class="row"><button class="btn ghost" id="pNo"></button><button class="btn" id="pGo"></button></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
// LOVEAPPS 번역 채팅(11-09 이름을 「오늘이 1일 · 1108」에서 바꿈, 기본 방 이름은 「채팅방」) — 디스코드처럼 왼쪽 방 목록 · 방 만들기 · 비밀번호 방(이박사님 11-09)

// 저장소: Firebase Realtime Database(chat1108). 방 목록 = roomlist/{id}, 글 = rooms/{열쇠}/msgs

const LANGS = [["ko", "한국어"], ["zh-TW", "繁體中文"], ["zh-CN", "简体中文"], ["en", "English"]];

function translate(text, tl) {

  const p = fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + encodeURIComponent(tl) + "&dt=t&q=" + encodeURIComponent(text))
    .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(j => (j[0] || []).map(x => x[0]).join(""));

let pending = null;
async function openRoom(id) {

  if (r.lock) {

  b.classList.toggle("on", !!V);
  const pn = $("vpanel");
  if (!V) { pn.hidden = true; return; }
  pn.hidden = false;
  pn.innerHTML = Object.entries(peers || {}).map(([p, x]) => {
    const st = p === uid ? (V.muted ? "mute" : "ok") : (V.pcs[p] && V.pcs[p].connectionState === "connected" ? "ok" : "wait");
    return '<span class="vp ' + st + '"><i></i>' + esc(x.n || "?") + (p === uid ? " (" + t("vMe") + ")" : "") + '</span>';
  }).join("") + '<button id="vmute" class="vtool">' + (V.muted ? "🎙️ " + t("vUnmute") : "🔇 " + t("vMute")) + '</button>' +
    '<button id="vstt" class="vtool" style="margin-left:0">' + (CAP && CAP.sr ? "📝 " + t("sttOff") : "📝 " + t("sttOn")) + '</button>';
  $("vmute").onclick = () => { V.muted = !V.muted; V.stream.getAudioTracks().forEach(x => x.enabled = !V.muted); drawVoice(V.peers); };
  $("vstt").onclick = () => { if (CAP && CAP.sr) stopSTT(true); else { store.set("chat_stt", "1"); startSTT(); } };
}
$("vbtn").onclick = joinVoice;
window.addEventListener("pagehide", () => leaveVoice());

// ── 사진 첨부 · 프로필 사진(이박사님 11-09, 무료만) ─────────────────────────────
// 무료 요금제라 Storage 대신 DB 에 줄인 그림(JPEG)을 넣는다. 대화 사진은 rooms/{열쇠}/img/{글번호}(긴 변 1280 · 화면에 뜰 때만 받음),
// 프로필 사진은 avatars/{내 번호}(96×96). 📎 단추 · 붙여넣기(Ctrl+V 스크린샷) · 끌어다 놓기로 올린다
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
function square(file, size) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
async function sendImage(file) {
  if (!file || !/^image\//.test(file.type) || !curRef || !me.n) return;
  let data;
  try { data = await shrink(file, 1280, .72); if (data.length > 400000) data = await shrink(file, 900, .6); } catch (e) { alert(t("imgFail")); return; }
  if (data.length > 400000) { alert(t("imgBig")); return; }
  const cap = $("msg").value.trim().slice(0, 1000), ref = curRef.push();
  try {
    await db.ref("rooms/" + cur.key + "/img/" + ref.key).set(data);
    await ref.set(withA({n: me.n, l: me.l, t: cap || "🖼️", u: uid, i: true, ts: firebase.database.ServerValue.TIMESTAMP}));
    if (cap) { $("msg").value = ""; grow(); }
  } catch (e) { alert(String(e.message || e)); }
}
$("clip").onclick = () => $("file").click();
$("file").onchange = e => { [...e.target.files].slice(0, 5).forEach(sendImage); e.target.value = ""; };
$("msg").addEventListener("paste", e => {
  const f = [...(e.clipboardData || {}).items || []].filter(x => x.kind === "file" && /^image\//.test(x.type)).map(x => x.getAsFile());
  if (f.length) { e.preventDefault(); f.slice(0, 5).forEach(sendImage); }
});
$("main").addEventListener("dragover", e => { if ([...e.dataTransfer.items].some(x => x.kind === "file")) e.preventDefault(); });
$("main").addEventListener("drop", e => { const f = [...e.dataTransfer.files].filter(x => /^image\//.test(x.type)); if (f.length) { e.preventDefault(); f.slice(0, 5).forEach(sendImage); } });
// 대화 사진: 화면에 그려질 때 받아 오고, 누르면 크게
const IMG = {};
async function loadImg(box) {
  const id = box.dataset.id;
  try {
    IMG[id] = IMG[id] || db.ref("rooms/" + cur.key + "/img/" + id).once("value").then(s => s.val());
    const src = await IMG[id]; if (!src) throw 0;
    const stick = nearBottom();
    box.innerHTML = '<img src="' + src + '" alt="">';
    box.querySelector("img").onload = () => { if (stick) log.scrollTop = log.scrollHeight; };
  } catch (e) { delete IMG[id]; box.textContent = "⚠"; }
}
$("log").addEventListener("click", e => {
  const im = e.target.closest(".pic img"); if (!im) return;
  $("big").querySelector("img").src = im.src; show("big");
});
$("big").onclick = () => hide("big");
// 프로필 사진: 사람마다 한 번만 받아 와서 그 사람의 동그라미에 모두 붙인다
const AV = {};
function avatarOf(u) {
  if (!u || AV[u] !== undefined) return;
  AV[u] = null;
  db.ref("avatars/" + u).on("value", s => { AV[u] = s.val() || null; paintAv(u); });
}
function paintAv(u) {
  document.querySelectorAll('.av[data-u="' + u + '"]').forEach(el => {
    if (AV[u]) { el.style.backgroundImage = "url(" + AV[u] + ")"; el.classList.add("pic1"); } else { el.style.backgroundImage = ""; el.classList.remove("pic1"); }
  });
}
$("avFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const d = await square(f, 96); await db.ref("avatars/" + uid).set(d); } catch (x) { alert(t("imgFail")); }
};
$("avPick").onclick = () => $("avFile").click();
$("avDel").onclick = () => db.ref("avatars/" + uid).remove();
$("meAv").dataset.u = uid; avatarOf(uid);
// 방 삭제: 방장(만든 기기)만. 글 · 녹음 · 사진 · 음성 자리(rooms/{방 번호})를 먼저, 그다음 목록에서
$("delRoom").onclick = async () => {
  if (!cur || cur.id === DEFAULT_ROOM || cur.r.own !== myAuth()) return;
  if (!confirm(fm(t("delQ"), roomName(cur.id, cur.r)))) return;
  const id = cur.id;
  try { leaveVoice(); await db.ref("rooms/" + id).remove(); await db.ref("roomlist/" + id).remove(); delete keys[id]; store.set("chat_keys", JSON.stringify(keys)); openRoom(DEFAULT_ROOM); }
  catch (e) { alert(String(e.message || e)); }
};

// ── 들어온 사람 알림(이박사님 11-09) ─────────────────────────────────────────
// 방에 들어오면 rooms/{열쇠}/here/{내 번호} 에 이름을 남기고(나가면 · 창을 닫으면 지워짐), 다른 사람이 새로 들어오면
// 대화창에 「○○ 님이 들어왔습니다」 + 위쪽 접속 인원. 안 보고 있으면 띵동 · 제목 숫자도
let HERE = null, hereReady = false;
function joinHere() {
  leaveHere();
  if (!cur || !me.n) return;
  const ref = db.ref("rooms/" + cur.key + "/here"), mine = ref.child(uid);
  HERE = {ref, mine}; hereReady = false;
  mine.onDisconnect().remove();
  mine.set({n: me.n, ts: firebase.database.ServerValue.TIMESTAMP});
  HERE.on = db.ref("online/" + cur.id + "/" + uid); HERE.on.onDisconnect().remove(); HERE.on.set(true);
  ref.on("child_added", s => {
    if (hereReady && s.key !== uid) {
      const v = s.val() || {}; sys(fm(t("joined"), v.n || "?"));
      if (document.hidden || !document.hasFocus()) ding();
    }
  });
  ref.on("value", s => { hereReady = true; $("here").textContent = "👥 " + Object.keys(s.val() || {}).length; });
  // 나간 사람(창 닫기 · 다른 방으로)도 표시(이박사님 11-09)
  ref.on("child_removed", s => { if (hereReady && s.key !== uid) sys(fm(t("left"), (s.val() || {}).n || "?"), true); });
}
function leaveHere() {
  if (!HERE) return;
  HERE.ref.off(); HERE.mine.onDisconnect().cancel(); HERE.mine.remove();
  if (HERE.on) { HERE.on.onDisconnect().cancel(); HERE.on.remove(); }
  HERE = null;
  $("here").textContent = "";
}
window.addEventListener("pagehide", leaveHere);

// ── 음성 채팅 번역 자막(이박사님 11-09, 무료) ─────────────────────────────────
// 음성 참가 중이면 내 말을 내 브라우저가 받아 적어(크롬 · 안드로이드 받아쓰기) rooms/{열쇠}/caps 에 한 줄씩 올리고,
// 듣는 사람은 그 줄을 자기 언어로 번역해 음성 칸 아래 작은 자막으로 본다. 자막 줄은 20초 뒤 지운다(쌓이지 않게)
let CAP = null;
function startCaps() {
  stopCaps();
  if (!V || !cur) return;
  const ref = db.ref("rooms/" + cur.key + "/caps"), since = Date.now();
  CAP = {ref, sr: null, on: true};
  ref.orderByChild("ts").startAt(since - 5000).on("child_added", async s => {
    const m = s.val(); if (!m || !CAP) return;
    if (m.u !== uid && m.ts > since - 5000) showCap(m);
    if (Date.now() - (m.ts || 0) > 20000) s.ref.remove().catch(() => {});
  });
  if (sttOn()) startSTT();
}
const TOUCH = matchMedia("(hover:none)").matches;
const sttOn = () => (store.get("chat_stt") ?? (TOUCH ? "0" : "1")) === "1";
function startSTT() {
  if (!CAP || CAP.sr) return;
  if (!SR) { capLine("⚠ " + t("capNo")); return; }
  const ref = CAP.ref, sr = new SR(), starts = []; sr.lang = SRL[me.l] || "ko-KR"; sr.continuous = true; sr.interimResults = false;
  sr.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) {
      const tx = e.results[i][0].transcript.trim();
      if (tx && V && !V.muted && curRef) curRef.push(withA({n: me.n, l: me.l, t: tx.slice(0, 1000), u: uid, s: true, ts: firebase.database.ServerValue.TIMESTAMP}));   // 채팅에도 글로(이박사님 11-09)
      if (tx && V && !V.muted) { const r = ref.push(); r.set({n: me.n, l: me.l, t: tx.slice(0, 300), u: uid, ts: firebase.database.ServerValue.TIMESTAMP}); setTimeout(() => r.remove().catch(() => {}), 25000); capLine("🗣 " + me.n + ": " + tx, true); }
    }
  };
  // 마이크 허용을 거절했거나 자꾸 다시 묻는 폰이면 받아쓰기만 끈다(음성 통화는 그대로)
  sr.onerror = e => { if (/not-allowed|service-not-allowed|audio-capture/.test(e.error || "")) { stopSTT(true); capLine("⚠ " + t("sttDenied")); } };
  sr.onend = () => {
    if (!CAP || CAP.sr !== sr) return;
    const now = Date.now(); starts.push(now); while (starts.length && now - starts[0] > 15000) starts.shift();
    if (starts.length > 4) { stopSTT(true); capLine("⚠ " + t("sttDenied")); return; }   // 15초에 다섯 번 넘게 끊기면 그만(허용 창이 계속 뜨는 경우)
    setTimeout(() => { try { if (CAP && CAP.sr === sr) sr.start(); } catch (x) {} }, 600);   // 조용하면 저절로 멈추니 다시
  };
  CAP.sr = sr;
  try { sr.start(); } catch (e) { CAP.sr = null; }
  if (V) drawVoice(V.peers);
}
function stopSTT(save) {
  if (save) store.set("chat_stt", "0");
  if (CAP && CAP.sr) { const sr = CAP.sr; CAP.sr = null; try { sr.stop(); } catch (e) {} }
  if (V) drawVoice(V.peers);
}
function stopCaps() {
  if (!CAP) return;
  stopSTT(false);
  CAP.on = false; CAP.ref.off();
  try { if (CAP.sr) CAP.sr.stop(); } catch (e) {}
  CAP = null; const c = $("caps"); if (c) c.innerHTML = "";
}
async function showCap(m) {
  let tx = m.t;
  if (m.l !== me.l) { try { tx = await translate(m.t, me.l); } catch (e) {} }
  capLine("🗣 " + m.n + ": " + tx + (tx !== m.t ? "  (" + m.t + ")" : ""));
}
function capLine(text, mine) {
  const c = $("caps"); if (!c) return;
  const d = document.createElement("div"); d.className = "cap" + (mine ? " mine" : ""); d.textContent = text;
  c.appendChild(d); while (c.children.length > 3) c.firstChild.remove();
  setTimeout(() => d.remove(), 15000);
}

applyLang();
// 처음 열 방: 주소의 #방 → ?room= → 지난번 방 → 1108
const want = decodeURIComponent(location.hash.slice(1)) || new URLSearchParams(location.search).get("room") || store.get("chat_room") || DEFAULT_ROOM;
db.ref("roomlist").once("value").then(s => { ROOMS = s.val() || {}; drawRooms(); openRoom(ROOMS[want] ? want : DEFAULT_ROOM); }, () => openRoom(DEFAULT_ROOM));
if (!me.n) { show("mJoin"); $("jName").focus(); }
</script>
