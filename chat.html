<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate"><!-- 크롬 「페이지 번역」 끄기 — 번역은 이 페이지가 글마다 따로 한다(크롬 번역 창 · 「번역 사용 중지」 알림이 뜨지 않게) -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOVEAPPS 채팅</title>
<link rel="manifest" href="chat.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LOVEAPPS">
<meta name="theme-color" content="#1e1f22">
<style>
/* 디스코드 느낌: 왼쪽 방 목록 · 가운데 대화(말풍선 없이 줄마다 동그라미 얼굴 · 이름 · 시각) · 아래 둥근 입력칸 */
:root{--rail:#1e1f22;--side:#2b2d31;--main:#313338;--input:#383a40;--hover:#2e3035;--line:#1f2023;--text:#dbdee1;--sub:#949ba4;--head:#f2f3f5;--blurple:#5865f2;--green:#23a559;--red:#f23f43}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--main);color:var(--text);font:15px/1.375 "gg sans","Noto Sans KR","Malgun Gothic","Microsoft JhengHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;height:100dvh}
#side{width:240px;flex:none;background:var(--side);display:flex;flex-direction:column}
#side .srv{height:48px;display:flex;align-items:center;padding:0 16px;font-weight:700;color:var(--head);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .cat{display:flex;align-items:center;justify-content:space-between;padding:18px 8px 4px 16px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--sub);text-transform:uppercase}
#side .cat button{background:none;border:0;color:var(--sub);font-size:20px;line-height:1;cursor:pointer;padding:0 6px}
#side .cat button:hover{color:var(--head)}
#rooms{flex:1;overflow:auto;padding:0 8px}
.room{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;margin:1px 0;border:0;border-radius:4px;background:none;color:var(--sub);cursor:pointer;text-align:left;font-size:15px}
.room:hover{background:var(--hover);color:var(--text)}
.room.on{background:#404249;color:var(--head)}
.room .h{font-size:20px;opacity:.7;width:20px;text-align:center}
.room span.nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .cnt{display:block;font-size:11px;color:var(--sub);line-height:1.2}
#me{height:52px;background:#232428;display:flex;align-items:center;gap:8px;padding:0 8px}
#me .av{width:32px;height:32px;font-size:14px}
#me .who{flex:1;min-width:0;cursor:pointer}
#me .who b{display:block;color:var(--head);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#me .who small{color:var(--red);font-size:12px}
#me select{background:var(--input);border:0;border-radius:4px;padding:4px;color:var(--text);max-width:96px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.2);color:var(--head);font-weight:700}
#top .h{font-size:20px;color:var(--sub);font-weight:400}
#top .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top a,#burger{color:var(--sub);text-decoration:none;background:none;border:0;font-size:20px;cursor:pointer}
#top{position:relative}
#more{background:none;border:0;color:var(--sub);font-size:22px;line-height:1;padding:0 4px;cursor:pointer;flex:none}
#menu{position:absolute;right:8px;top:44px;z-index:8;min-width:170px;background:#111214;border:1px solid #2b2d31;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:6px;display:flex;flex-direction:column}
#menu[hidden]{display:none}
#menu>*{background:none;border:0;color:var(--text);text-align:left;font-size:14px;font-weight:500;padding:8px 10px;border-radius:4px;cursor:pointer;text-decoration:none;white-space:nowrap}
#menu>*:hover{background:var(--blurple);color:#fff}
#menu>[hidden]{display:none}
#owner{display:none}
@media (max-width:720px){#top{gap:6px;padding:0 8px}#vbtn{padding:3px 8px}}
#burger{display:none}
#log{flex:1;overflow:auto;padding:16px 0 8px}
.msg{display:flex;gap:16px;padding:2px 16px;margin-top:17px}
.msg.cont{margin-top:0}
.msg:hover{background:var(--hover)}
.av{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.msg.cont .av{visibility:hidden;height:0}
.av{background-size:cover;background-position:center}
.av.pic1{color:transparent}
.pic{margin:4px 0 2px;max-width:min(420px,100%);min-height:40px;color:var(--sub)}
.pic img{display:block;max-width:100%;max-height:360px;border-radius:8px;cursor:zoom-in}
#clip{background:none;border:0;color:var(--sub);font-size:20px;padding:6px;cursor:pointer}
#clip:hover,#mic:hover{color:var(--head)}
.room .own{font-size:12px}
.msg{position:relative}
.mrep{position:absolute;right:56px;top:-6px;display:none;background:#2b2d31;border:1px solid #1f2023;border-radius:6px;padding:2px 6px;cursor:pointer;font-size:14px;color:var(--text)}
.msg:hover .mrep,.msg:focus-within .mrep,.msg.sel .mrep,.msg.sel .mdel{display:block}
.msg.sel{background:var(--hover)}
.msg{-webkit-touch-callout:none}
.msg:not(:has(.mdel)) .mrep{right:16px}
.rep{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin:0 0 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep b{color:var(--text);font-weight:600}
.rep:hover{color:var(--text)}
.msg.flash{background:rgba(88,101,242,.18);transition:background 1.2s}
#rbar{display:none;align-items:center;gap:8px;background:#2b2d31;border-radius:8px 8px 0 0;padding:6px 12px;font-size:13px;color:var(--sub)}
#rbar.on{display:flex}
#rbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rbar b{color:var(--text)}
#rbar button{background:none;border:0;color:var(--sub);font-size:16px;cursor:pointer}
#rbar.on + .box{border-radius:0 0 8px 8px}
.mdel{position:absolute;right:16px;top:-6px;display:none;background:#2b2d31;border:1px solid #1f2023;border-radius:6px;padding:2px 6px;cursor:pointer;font-size:14px}
.msg:hover .mdel,.msg:focus-within .mdel{display:block}
@media (hover:none){.mdel,.mrep{display:block}}
.body{min-width:0;flex:1}
.hd{display:flex;align-items:baseline;gap:8px}
.hd b{font-weight:600}
.hd .tm{font-size:12px;color:var(--sub)}
.hd .lg{font-size:10px;padding:0 5px;border-radius:3px;background:#4e5058;color:#dbdee1;font-weight:700}
.msg.cont .hd{display:none}
.tx{white-space:pre-wrap;word-break:break-word}
/* 원문이 위, 내가 고른 언어 번역이 아래(이박사님 11-09) */
.org{white-space:pre-wrap;word-break:break-word;color:#a5b4fc;font-size:14px;margin-top:2px;padding-left:8px;border-left:2px solid #5865f2}
.org.fail{color:var(--sub);border-left-color:#4e5058}
.wait{color:var(--sub);font-style:italic}
.day{display:flex;align-items:center;gap:8px;margin:20px 16px 4px;color:var(--sub);font-size:12px;font-weight:600}
.day:before,.day:after{content:"";flex:1;height:1px;background:#3f4147}
.empty{color:var(--sub);text-align:center;margin-top:40px}
.sys{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 72px;margin-top:8px;color:var(--sub);font-size:14px}
.sys:before{content:"→";color:var(--green);font-weight:700}
.sys.out:before{content:"←";color:var(--red)}
#bar{padding:0 16px calc(20px + env(safe-area-inset-bottom))}
#bar .box{display:flex;align-items:flex-end;background:var(--input);border-radius:8px;padding:0 6px 0 16px}
#msg{flex:1;background:none;border:0;outline:none;resize:none;padding:11px 0;max-height:200px;height:44px}
#msg::placeholder{color:#6d6f78}
#send{background:none;border:0;color:var(--sub);font-size:20px;padding:8px 10px;cursor:pointer}
#send:hover,#emo:hover{color:var(--head)}
#emo{background:none;border:0;color:var(--sub);font-size:22px;padding:6px 6px;cursor:pointer;filter:grayscale(1);transition:filter .15s,transform .15s}
#emo:hover,#emo.on{filter:none;transform:scale(1.15)}
#bar{position:relative}
#mic{background:none;border:0;color:var(--sub);font-size:20px;padding:6px;cursor:pointer}
#mic.on{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.play{background:#2b2d31;border:1px solid #3f4147;color:var(--head);border-radius:16px;padding:4px 12px;margin:2px 0 3px;cursor:pointer;font-weight:600}
.play:hover{background:#404249}
#vbtn{background:none;border:1px solid #4e5058;color:var(--text);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
#vbtn.on{background:var(--red);border-color:var(--red);color:#fff}
#vpanel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#2b2d31;border-bottom:1px solid var(--line)}
#vpanel[hidden]{display:none}
#caps{padding:0 12px;background:#2b2d31}
#live{display:flex;flex-direction:column;background:#1e1f22;border-left:1px solid #3f4147;min-height:0;min-width:0;overflow:hidden}
#main.vs{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto 1fr auto}
#main.vs>#top{grid-column:1/-1;grid-row:1}
#main.vs>#caps{display:none}
#main.vs>#log{grid-column:1;grid-row:3;min-height:0}
#main.vs>#bar{grid-column:1;grid-row:4}
#main.vs>#live{grid-column:2;grid-row:2/-1}
#live #vpanel{border-top:1px solid #111214;border-bottom:0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:none}
#live #vpanel::-webkit-scrollbar{display:none}
#live #vpanel>*{flex:none;white-space:nowrap}
#liveMin{display:none}
#live[hidden]{display:none}
#live .lh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#2b2d31;border-bottom:1px solid #111214;color:var(--head);font-size:14px}
#live .lh b{flex:none}
#liveMe{flex:1;min-width:0;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
#live .lh button{background:none;border:0;color:var(--sub);font-size:16px;cursor:pointer}
#liveLog{flex:1;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.lv{display:flex;gap:10px}
.lv .la{width:30px;height:30px;font-size:13px;flex:none}
.lv .lb{min-width:0;flex:1}
.lv .ln{font-size:14px;font-weight:800}
.lv .ln small{font-weight:400;color:var(--sub);font-size:11px;margin-left:6px}
.lv .lt{font-size:17px;line-height:1.35;color:#fff}
.lv .lo{font-size:12px;color:var(--sub)}
.lv.mine .lt{color:#c9cdfb}
#liveOpen{position:fixed;right:16px;bottom:96px;z-index:7;width:48px;height:48px;border-radius:50%;border:0;background:var(--blurple);color:#fff;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.5);cursor:pointer}
#liveOpen[hidden]{display:none}
@media (max-width:720px){#main.vs{display:flex}#main.vs>#live{flex:none;height:45dvh;border-left:0;border-top:2px solid #3f4147}#main.vs>#bar{padding-bottom:8px}}
#caps:empty{display:none}
.cap{font-size:13px;color:#e3e5e8;padding:3px 0;border-bottom:1px solid #232428;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap.mine{color:var(--sub)}
.vp{display:inline-flex;align-items:center;gap:6px;background:#383a40;border-radius:12px;padding:3px 10px;font-size:13px}
.vp i{width:8px;height:8px;border-radius:50%;background:#80848e}
.vp.ok i{background:var(--green)}
.vp.mute i{background:var(--red)}
.vtool{margin-left:auto;background:#383a40;border:0;border-radius:12px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--text)}
.vtool.on{background:#23a559;color:#fff;font-weight:700}
.vtool.off{background:#da373c;color:#fff;font-weight:700}
.vtool{white-space:nowrap}
.vtool.on.talk{background:#57f287;color:#111;box-shadow:0 0 0 2px #57f287aa}   /* 말하는 중 = 밝은 초록 */
#pick{position:absolute;right:16px;bottom:calc(100% + 4px);width:min(352px,calc(100vw - 32px));max-height:300px;overflow:auto;background:#2b2d31;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:8px;display:none;z-index:4}
#pick.on{display:block}
#pick .cat2{font-size:12px;font-weight:700;color:var(--sub);margin:6px 4px 4px}
#pick .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
#pick button{background:none;border:0;border-radius:4px;font-size:24px;line-height:1;padding:6px 0;cursor:pointer}
#pick button:hover{background:#404249}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.card{background:var(--main);border-radius:8px;width:100%;max-width:440px;padding:24px 16px 16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h2{margin:0 0 6px;text-align:center;color:var(--head);font-size:22px}
.card p{margin:0 0 16px;text-align:center;color:var(--sub);font-size:14px}
.card label{display:block;font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase;margin:12px 0 6px}
.card input,.card select{width:100%;background:var(--rail);border:0;border-radius:4px;padding:10px;outline:none}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{border:0;border-radius:4px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--blurple);color:#fff}
.btn.ghost{background:none;color:var(--text)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
@media (max-width:720px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:5;transform:translateX(-100%);transition:transform .2s}
  #app.open #side{transform:none;box-shadow:4px 0 16px rgba(0,0,0,.5)}
  #burger{display:block}
  .msg{gap:12px;padding:2px 12px}
  .av{width:36px;height:36px}
}
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <div class="srv">LOVEAPPS</div>
    <div class="cat"><span id="cT"></span><button id="addRoom" title="+">＋</button></div>
    <div id="rooms"></div>
    <div id="me"><div class="av" id="meAv"></div><div class="who" id="meWho"><b id="meN"></b><small id="mode"></small></div><select id="lang" aria-label="language"></select></div>
  </nav>
  <main id="main">
    <div id="top"><button id="burger" aria-label="menu">☰</button><span class="h" id="topH">#</span><span class="t" id="topT"></span><span id="owner" style="color:#f0b232;font-size:13px;font-weight:600;white-space:nowrap;margin-left:6px"></span><span id="here" style="color:var(--sub);font-size:13px;font-weight:600;white-space:nowrap"></span><button id="vbtn"></button><button id="more" aria-label="menu">⋯</button>
      <div id="menu" hidden><button id="delRoom" hidden></button><button id="pushB"></button><button id="installB"></button><button id="bell"></button><button id="leaveRoom" hidden></button><a href="./" id="homeL"></a></div></div>
    <div id="vpanel" hidden></div>
    <div id="caps"></div>
    <div id="log"></div>
    <div id="bar"><div id="rbar"><span id="rbarT"></span><button id="rbarX" aria-label="cancel">✕</button></div><div class="box"><textarea id="msg" maxlength="1000" rows="1"></textarea><button id="clip" aria-label="attach">📎</button><input id="file" type="file" accept="image/*" multiple hidden><button id="mic" aria-label="voice message">🎤</button><button id="emo" aria-label="emoji">😀</button><button id="send" aria-label="send">➤</button></div><div id="pick"></div></div>
  </main>
</div>

<div class="modal" id="mJoin"><div class="card">
  <h2 id="jT"></h2><p id="jD"></p>
  <label id="jNL"></label><input id="jName" maxlength="40" autocomplete="nickname">
  <label id="jLL"></label><select id="jLang"></select>
  <label id="jAL"></label><div style="display:flex;gap:8px;align-items:center"><div class="av" id="jAv" style="width:56px;height:56px"></div><button class="btn ghost" id="avPick" type="button"></button><button class="btn ghost" id="avDel" type="button"></button><input id="avFile" type="file" accept="image/*" hidden></div>
  <div class="row"><button class="btn" id="jGo"></button></div>
</div></div>

<div class="modal" id="mNew"><div class="card">
  <h2 id="nT"></h2><p id="nD"></p>
  <label id="nNL"></label><input id="nName" maxlength="30">
  <label id="nPL"></label><input id="nPw" type="password" maxlength="40" autocomplete="new-password">
  <label id="nML"></label><input id="nMax" type="number" min="2" max="100" inputmode="numeric">
  <div class="err" id="nErr"></div>
  <div class="row"><button class="btn ghost" id="nNo"></button><button class="btn" id="nGo"></button></div>
</div></div>

<div id="live" hidden><div class="lh"><b id="liveT"></b><span id="liveMe"></span><button id="liveMin" aria-label="minimize">▁</button></div><div id="liveLog"></div></div>
<button id="liveOpen" hidden>🗣</button>
<div class="modal" id="big" style="cursor:zoom-out"><img alt="" style="max-width:96vw;max-height:92vh;border-radius:6px"></div>

<div class="modal" id="mCfg"><div class="card">
  <h2 id="cT"></h2><p id="cD"></p>
  <label id="cNL"></label><input id="cName" maxlength="30">
  <label id="cML"></label><input id="cMax" type="number" min="2" max="100" inputmode="numeric">
  <label id="cSL"></label><button class="btn ghost" id="cClose" style="width:100%"></button>
  <button class="btn ghost" id="cWipe" style="width:100%;margin-top:8px;color:#f23f43"></button>
  <div class="err" id="cErr"></div>
  <div class="row"><button class="btn ghost" id="cDel" style="margin-right:auto;color:#f23f43"></button><button class="btn ghost" id="cNo"></button><button class="btn" id="cGo"></button></div>
</div></div>
<div class="modal" id="mPw"><div class="card">
  <h2 id="pT"></h2><p id="pD"></p>
  <label id="pPL"></label><input id="pPw" type="password" maxlength="40" autocomplete="current-password">
  <div class="err" id="pErr"></div>
  <div class="row"><button class="btn ghost" id="pNo"></button><button class="btn" id="pGo"></button></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// LOVEAPPS 번역 채팅(11-09 이름을 「오늘이 1일 · 1108」에서 바꿈, 기본 방 이름은 「채팅방」) — 디스코드처럼 왼쪽 방 목록 · 방 만들기 · 비밀번호 방(이박사님 11-09)
// 원문만 저장하고, 보는 사람마다 자기 언어로 번역해 보여 준다(각자 브라우저에서 구글 번역 무료 주소 — 공용 한도 없음)
// 저장소: Firebase Realtime Database(chat1108). 방 목록 = roomlist/{id}, 글 = rooms/{열쇠}/msgs
//   열린 방의 열쇠 = id + "/o", 비밀번호 방의 열쇠 = id + "/" + sha256(id + 비번) 앞 20자 → 비번을 모르면 글이 있는 자리를 알 수 없다
//   방장 = 방을 만든 기기의 익명 로그인 번호(roomlist own) — 방장만 방을 지울 수 있다(DB 규칙이 확인)
//   roomlist 의 chk = sha256(열쇠 + "chk") 앞 12자 — 들어갈 때 비번이 맞는지만 확인(열쇠 자체는 저장하지 않는다)
// 설정값은 공개용(비밀 아님). 쓰기 · 읽기 제한은 DB 규칙
const FIREBASE_CONFIG = {

let GOOGLE_OFF = 0;
const MM = {ko: "ko", "zh-TW": "zh-TW", "zh-CN": "zh-CN", en: "en"};
async function viaGoogle(text, tl) {
  const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + encodeURIComponent(tl) + "&dt=t&q=" + encodeURIComponent(text));
  if (!r.ok) throw new Error("google " + r.status);
  return ((await r.json())[0] || []).map(x => x[0]).join("");
}
async function viaMyMemory(text, tl, sl) {
  if (!sl || !MM[sl] || sl === tl) throw new Error("mm lang");
  const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text.slice(0, 480)) + "&langpair=" + MM[sl] + "|" + MM[tl]);
  const j = await r.json();
  if (!r.ok || j.responseStatus != 200 || !j.responseData) throw new Error("mm " + (j.responseStatus || r.status));
  return j.responseData.translatedText;
}
function translate(text, tl, sl) {
  const key = tl + "\u0001" + text;
  if (TC.has(key)) return TC.get(key);
  const p = (async () => {
    if (Date.now() > GOOGLE_OFF) {
      try { return await viaGoogle(text, tl); } catch (e) { GOOGLE_OFF = Date.now() + 5 * 60e3; }   // 막히면 5분 쉬었다가 다시
    }
    return await viaMyMemory(text, tl, sl);
  })();

}

async function startRec() {

  const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  const mr = new MediaRecorder(stream, mime ? {mimeType: mime, audioBitsPerSecond: 24000} : undefined), chunks = [];

// 무료 요금제라 Storage 대신 DB 에 줄인 그림(JPEG)을 넣는다. 대화 사진은 rooms/{열쇠}/img/{글번호}(긴 변 1280 · 화면에 뜰 때만 받음),
// 프로필 사진은 avatars/{내 번호}(96×96). 📎 단추 · 붙여넣기(Ctrl+V 스크린샷) · 끌어다 놓기로 올린다
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
function square(file, size) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}

// 받아쓰기는 모두 기본으로 켠다(11-09 휴대폰에서 꺼져 있어 한쪽 말만 번역됨). 허용 창이 자꾸 뜨는 폰은 저절로 꺼진다(stopSTT)
// 받아쓰기 켜짐 여부 — 사람이 직접 끈 것만 기억한다(11-10: 저절로 꺼진 것까지 「꺼짐」으로 저장돼 실시간 번역이 영영 멈추던 것. 새 이름 chat_stt2 로 모두 다시 켬)
// 폰(터치)에서는 크롬 받아쓰기를 쓰지 않는다 — 통화가 마이크를 쥐고 있어 소리를 못 듣고, 10초마다 다시 켜지며 「마이크 허용」 창만 계속 뜸(11-10 원격 진단: start→audio 반복, speech 0)
const sttOn = () => (store.get("chat_stt2") ?? "1") === "1";
// 진단(11-10): 받아쓰기 상태를 내 음성 참가 정보(voice/{나}.st)에 올린다 — 원격으로 원인 확인용
let STT_LAST = "";
function sttStat(x) { if (x === STT_LAST) return; STT_LAST = x; try { if (V && V.meRef) V.meRef.update({st: String(x).slice(0, 80), stt: firebase.database.ServerValue.TIMESTAMP}); } catch (e) {} }
// 받아쓰기 한 마디 → 채팅 글 · 실시간 번역 칸 · 자막(상대가 번역해 봄)
const GHOST = new Set(["thank you", "thanks", "thank you very much", "thank you for watching", "thanks for watching", "you", "bye", "okay", "ok", "감사합니다", "고맙습니다", "시청해주셔서 감사합니다", "谢谢", "謝謝", "谢谢观看", "謝謝觀看", "ご視聴ありがとうございました", "ありがとうございました"]);
const isGhost = t => GHOST.has(t.toLowerCase().replace(/[\s.,!?。，！？、…~]+/g, " ").trim());
function sttFinal(tx, said) {
  tx = (tx || "").trim();
  if (!tx || !V || V.muted || !CAP || isGhost(tx)) { $("liveMe").textContent = ""; return; }
  // 말한 언어(서버가 알아냄)로 표시 — 설정과 다른 언어로 말해도 상대가 바르게 번역받게
  const L = !said ? me.l : said === "zh" ? (me.l.startsWith("zh") ? me.l : "zh-CN") : said;
  $("liveMe").textContent = ""; liveRow(me.n, tx, true, uid);
  const r = CAP.ref.push(); r.set({n: me.n, l: L, t: tx.slice(0, 300), u: uid, ts: firebase.database.ServerValue.TIMESTAMP}); setTimeout(() => r.remove().catch(() => {}), 25000);
  capLine("🗣 " + me.n + ": " + tx, true);
}

// ── 서버 받아쓰기(11-10) ─────────────────────────────────────────
// 통화에 쓰는 마이크 소리를 그대로 말 단위(조용 0.8초 · 최대 14초)로 잘라 서버로 보낸다 → 서버가 Groq → SenseVoice 순서로 글로 바꿈.
// 폰 크롬 받아쓰기는 통화 중 마이크를 못 써서(원격 진단 start→audio 반복, 말소리 0) 이 길이 1순위. 서버가 세 번 연속 실패하면 PC 는 크롬 받아쓰기로
const SRV_LANG = {ko: "ko", "zh-TW": "zh", "zh-CN": "zh", en: "en"};
let SRV = null, ACX = null;
function audioCtx() { try { if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)(); ACX.resume().catch(() => {}); } catch (e) {} return ACX; }
document.addEventListener("pointerdown", () => { if (ACX && ACX.state !== "running") ACX.resume().catch(() => {}); });
function startSrvStt() {
  if (!V || !CAP || SRV) return !!SRV;
  const ac = audioCtx(); if (!ac || !ac.createScriptProcessor) return false;
  try {
    const src = ac.createMediaStreamSource(V.stream), node = ac.createScriptProcessor(4096, 1, 1);
    const st = {src, node, v: V, buf: [], len: 0, talking: false, quiet: 0, floor: 0.008, pre: null, fails: 0, q: Promise.resolve()};
    node.onaudioprocess = e => {
      const x = e.inputBuffer.getChannelData(0), dur = x.length / ac.sampleRate;
      let q = 0; for (let i = 0; i < x.length; i++) q += x[i] * x[i];
      const rms = Math.sqrt(q / x.length);
      if (st.v.muted || V !== st.v) { st.talking = false; st.buf = []; st.len = 0; return; }
      if (!st.talking) st.floor = st.floor * 0.95 + Math.min(rms, 0.05) * 0.05;   // 주변 소음 크기 따라가기
      const th = Math.max(0.02, st.floor * 3.5);   // 잡음에 덜 반응하게(11-10)
      if (rms > th) {
        st.quiet = 0;
        if (!st.talking) { st.talking = true; st.buf = st.pre ? [st.pre] : []; st.len = st.pre ? st.pre.length : 0; $("liveMe").textContent = "🎙 " + me.n + " …"; }
      }
      if (st.talking) {
        st.buf.push(new Float32Array(x)); st.len += x.length;
        if (rms <= th) st.quiet += dur;
        if (st.quiet > 0.8 || st.len / ac.sampleRate > 14) srvFlush(st, ac.sampleRate);
      } else st.pre = new Float32Array(x);   // 말 시작이 잘리지 않게 바로 앞 조각을 붙인다
    };
    src.connect(node); node.connect(ac.destination);   // 출력은 0(소리 안 남) — 연결해야 돌아감
    SRV = st; sttStat("srv");
    if (V) drawVoice(V.peers);
    return true;
  } catch (e) { sttStat("srv-start " + (e.message || e)); return false; }
}
function stopSrvStt() {
  if (!SRV) return;
  try { SRV.node.onaudioprocess = null; SRV.src.disconnect(); SRV.node.disconnect(); } catch (e) {}
  SRV = null;
}
function srvFlush(st, rate) {
  const n = st.len, parts = st.buf, speech = n / rate - st.quiet;
  st.talking = false; st.buf = []; st.len = 0; st.quiet = 0;
  if (speech < 0.5) { $("liveMe").textContent = ""; return; }
  const all = new Float32Array(n); let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
  const wav = toWav16k(all, rate);
  st.q = st.q.then(async () => {   // 순서대로 하나씩
    try {
      const ac2 = new AbortController(), tm = setTimeout(() => ac2.abort(), 15000);   // 서버가 멈춰도 줄이 막히지 않게
      const r = await fetch(VOICE_API + "/voice/stt?lang=" + (SRV_LANG[me.l] || ""), {method: "POST", headers: {"Content-Type": "audio/wav"}, body: wav, signal: ac2.signal}).finally(() => clearTimeout(tm));
      if (!r.ok) throw new Error("stt " + r.status);
      const j = await r.json(); st.fails = 0; sttStat("srv:" + (j.engine || "?"));
      if (j.text) sttFinal(j.text, j.lang); else $("liveMe").textContent = "";
    } catch (e) {
      st.fails++; sttStat("srv-fail " + (e.message || e)); $("liveMe").textContent = "⚠ STT";
      if (st.fails >= 3 && SRV === st && !TOUCH && SR) { stopSrvStt(); startSTT(); }   // ③ 서버까지 안 되면 PC 는 크롬 받아쓰기. 폰은 끄지 않고 계속 서버에 보낸다(서버가 살아나면 바로 됨)
    }
  });
}
function toWav16k(x, rate) {
  const k = rate / 16000, n = Math.floor(x.length / k), b = new ArrayBuffer(44 + n * 2), d = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); d.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, 16000, true); d.setUint32(28, 32000, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, "data"); d.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * k), z = Math.min(x.length, Math.floor((i + 1) * k)); let v = 0; for (let j = a; j < z; j++) v += x[j]; v /= Math.max(1, z - a);
    d.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true);
  }
  return b;
}
const sttActive = () => !!(CAP && (CAP.sr || SRV));
function startSTT() {
  if (!CAP || CAP.sr) return;
  if (!SR) { capLine("⚠ " + t("capNo")); sttStat("nosr " + navigator.userAgent.slice(-60)); return; }
  let sr; try { sr = new SR(); } catch (e) { liveRow("⚠", t("capNo"), true); return; }
  const ref = CAP.ref, starts = []; sr.lang = SRL[me.l] || "ko-KR"; sr.continuous = true; sr.interimResults = true;
  sr.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) if (!e.results[i].isFinal) interim += e.results[i][0].transcript;
    $("liveMe").textContent = interim ? "🎙 " + me.n + ": " + interim : "✅ STT";
    sttStat("result");
    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) sttFinal(e.results[i][0].transcript);
  };
  // 마이크 허용을 거절했거나 자꾸 다시 묻는 폰이면 받아쓰기만 끈다(음성 통화는 그대로)
  // 진단(11-10): 받아쓰기 오류를 실시간 번역 칸 위 한 줄에 보인다 — no-speech 는 조용할 때 나는 정상 오류라 뺌
  sr.onstart = () => sttStat("start");
  sr.onspeechstart = () => sttStat("speech");
  sr.onaudiostart = () => { sttStat("audio"); if (!/^🎙|^⚠/.test($("liveMe").textContent)) $("liveMe").textContent = "👂 STT"; };   // 받아쓰기가 마이크 소리를 받기 시작함
  sr.onerror = e => { sttStat("err:" + e.error); if (e.error && e.error !== "no-speech" && e.error !== "aborted") $("liveMe").textContent = "⚠ STT: " + e.error; };
  sr.addEventListener("error", e => { if (/not-allowed|service-not-allowed/.test(e.error || "")) { stopSTT(false); capLine("⚠ " + t("sttDenied")); } });   // 마이크 거절만 멈춤(저장 안 함). 그 밖(조용함 · 잠깐 마이크 못 잡음)은 onend 가 다시 켠다
  sr.onend = () => {
    if (!CAP || CAP.sr !== sr) return;
    const now = Date.now(); starts.push(now); while (starts.length && now - starts[0] > 15000) starts.shift();
    const wait = starts.length > 4 ? 3000 : 600;   // 자주 끊기면 끄지 않고 천천히 다시(허용 창이 자꾸 뜨는 폰 배려)
    setTimeout(() => { try { if (CAP && CAP.sr === sr) sr.start(); } catch (x) {} }, wait);   // 조용하면 저절로 멈추니 다시
  };
  CAP.sr = sr;
  try { sr.start(); } catch (e) { CAP.sr = null; sttStat("startfail " + (e.message || e).toString().slice(0, 60)); }
  if (!CAP.sr) liveRow("⚠", t("capNo"), true);
  if (V) drawVoice(V.peers);
}
function stopSTT(save) {
  if (save) store.set("chat_stt2", "0");
  stopSrvStt();
  if (CAP && CAP.sr) { const sr = CAP.sr; CAP.sr = null; try { sr.stop(); } catch (e) {} }
  if (V) drawVoice(V.peers);
}
function stopCaps() {
  if (!CAP) return;
  stopSTT(false);
  CAP.on = false; CAP.ref.off();
  try { if (CAP.sr) CAP.sr.stop(); } catch (e) {}
  CAP = null; const c = $("caps"); if (c) c.innerHTML = "";
}
async function showCap(m) {
  if (isGhost(m.t || "")) return;   // 옛 판 폰이 보낸 지어낸 말도 거른다
  const row = liveRow(m.n, m.t, false, m.u);
  let tx = m.t;
  if (m.l !== me.l) { try { tx = await translate(m.t, me.l, m.l); } catch (e) {} }
  capLine("🗣 " + m.n + ": " + tx + (tx !== m.t ? "  (" + m.t + ")" : ""));
  row.querySelector(".lt").textContent = tx; row.querySelector(".lo").textContent = tx !== m.t ? m.t : "";
}
// 실시간 번역 창: 음성 참가하면 저절로 열리고, ▁ 로 접으면 🗣 동그라미로
function liveRow(n, text, mine) {
  const lg = $("liveLog"), d = document.createElement("div"), stick = lg.scrollHeight - lg.scrollTop - lg.clientHeight < 60;
  d.className = "lv" + (mine ? " mine" : "");
  const u = arguments[3] || "", tm = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  d.innerHTML = '<div class="av la" data-u="' + esc(u) + '" style="background-color:' + colorOf(u || n) + '">' + esc((n || "?").charAt(0).toUpperCase()) + '</div><div class="lb"><div class="ln" style="color:' + colorOf(u || n) + '">' + esc(n) + (mine ? ' (' + esc(t("vMe")) + ')' : '') + '<small>' + tm + '</small></div><div class="lt">' + esc(text) + '</div><div class="lo"></div></div>';
  if (u && typeof paintAv === "function") { avatarOf(u); paintAv(u); }
  lg.appendChild(d); while (lg.children.length > 60) lg.firstChild.remove();
  if (stick) lg.scrollTop = lg.scrollHeight;
  return d;
}
$("main").appendChild($("live")); $("live").appendChild($("vpanel"));   // 참가자 · 단추 줄은 음성 칸 맨 아래(11-10)
function liveShow(on) { $("live").hidden = !on; $("liveOpen").hidden = true; $("main").classList.toggle("vs", !!on); }
$("liveMin").onclick = () => liveShow(false);
$("liveOpen").onclick = () => liveShow(true);
function capLine(text, mine) {
  const c = $("caps"); if (!c || !$("live").hidden) return;   // 실시간 번역 창이 열려 있으면 작은 자막은 안 띄움(겹치지 않게)
  const d = document.createElement("div"); d.className = "cap" + (mine ? " mine" : ""); d.textContent = text;
  c.appendChild(d); while (c.children.length > 3) c.firstChild.remove();
  setTimeout(() => d.remove(), 15000);
}

applyLang();
// 처음 열 방: 주소의 #방 → ?room= → 지난번 방 → 1108
const want = decodeURIComponent(location.hash.slice(1)) || new URLSearchParams(location.search).get("room") || store.get("chat_room") || DEFAULT_ROOM;
// 비밀번호 방인데 이 기기에 열쇠가 없으면 처음엔 묻지 않고 「방을 고르세요」
// 모든 사용자는 대기화면(방 고르기)부터 시작한다(이박사님 11-09)
const first = async () => { OPEN = (await cfgP) || null; noRoom(); };
db.ref("roomlist").once("value").then(s => { ROOMS = withDef(s.val()); drawRooms(); first(); }, () => { ROOMS = withDef(); drawRooms(); first(); });
if (!me.n) { show("mJoin"); $("jName").focus(); }
</script>
