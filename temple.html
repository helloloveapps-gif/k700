<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>온라인 기도</title>
<style>
:root{--bg:#14110d;--wall:#3a1f16;--red:#8e2a1c;--gold:#d9a441;--ink:#1a120c;--paper:#f3e6c8;--muted:#b9a27a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:"Noto Serif KR","Nanum Myeongjo",serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:9}
#gate input{font-size:20px;padding:10px 14px;border-radius:10px;border:2px solid var(--gold);background:#000;color:var(--paper);text-align:center;width:200px}
#gate button,.btn{font-size:18px;padding:10px 22px;border-radius:12px;border:2px solid var(--ink);background:var(--gold);color:var(--ink);font-weight:700;cursor:pointer;font-family:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 16px 24px}
h1{font-size:22px;margin:6px 0 2px;color:var(--gold);letter-spacing:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
#hall{position:relative;width:100%;aspect-ratio:1/1.05;max-height:62vh;background:var(--wall);border:4px solid var(--ink);border-radius:6px;overflow:hidden}
#hall svg{position:absolute;inset:0;width:100%;height:100%}
#cnt{font-size:44px;font-weight:800;color:var(--gold);margin-top:10px;line-height:1}
#cnt small{font-size:18px;color:var(--muted)}
#msg{min-height:22px;color:var(--paper);font-size:15px;margin:6px 0 10px;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#bow{font-size:22px;padding:14px 40px}
.btn.ghost{background:transparent;color:var(--gold);border-color:var(--gold);font-size:15px;padding:8px 14px}
#live{margin-top:14px;font-size:13px;color:var(--muted);text-align:center;line-height:1.7}
.smoke{animation:smoke 4s steps(12) infinite;transform-origin:center}
@keyframes smoke{0%{opacity:0;transform:translateY(0)}20%{opacity:.6}100%{opacity:0;transform:translateY(-40px)}}
.flame{animation:fl 1s steps(4) infinite}
@keyframes fl{50%{transform:scaleY(.8)}}
</style>
</head>
<body>
<div id="gate">
  <div style="font-size:40px">🙏</div>
  <div>온라인 기도 · 들어가는 비밀번호</div>
  <input id="nick" maxlength="20" placeholder="아이디(이름)" autocomplete="off">
  <input id="pw" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호">
  <button id="go">들어가기</button>
  <div id="bad" style="color:#e66;min-height:20px"></div>
</div>

<div id="app" hidden>
  <h1>온라인 백팔배</h1>
  <div class="sub">마음을 내려놓고, 한 번에 한 배씩 · <span id="who"></span></div>
  <div id="hall">
    <svg viewBox="0 0 300 315" aria-label="법당">
      <!-- 단청 띠 -->
      <rect x="0" y="0" width="300" height="22" fill="#1f5c4a"/>
      <g fill="#c9483a"><rect x="10" y="6" width="20" height="10"/><rect x="50" y="6" width="20" height="10"/><rect x="90" y="6" width="20" height="10"/><rect x="130" y="6" width="40" height="10"/><rect x="190" y="6" width="20" height="10"/><rect x="230" y="6" width="20" height="10"/><rect x="270" y="6" width="20" height="10"/></g>
      <rect x="0" y="22" width="300" height="4" fill="#1a120c"/>
      <!-- 기둥 -->
      <rect x="8" y="26" width="18" height="220" fill="#8e2a1c" stroke="#1a120c" stroke-width="2"/>
      <rect x="274" y="26" width="18" height="220" fill="#8e2a1c" stroke="#1a120c" stroke-width="2"/>
      <!-- 연등 -->
      <g stroke="#1a120c" stroke-width="2">
        <line x1="55" y1="26" x2="55" y2="44"/><ellipse cx="55" cy="56" rx="13" ry="12" fill="#e2563f"/>
        <line x1="245" y1="26" x2="245" y2="44"/><ellipse cx="245" cy="56" rx="13" ry="12" fill="#e9b949"/>
      </g>
      <!-- 광배 -->
      <circle cx="150" cy="105" r="62" fill="#5a2e1d" stroke="#d9a441" stroke-width="3"/>
      <circle cx="150" cy="105" r="50" fill="none" stroke="#d9a441" stroke-width="1.5" stroke-dasharray="4 5"/>
      <!-- 부처님(단순한 앉은 모습) -->
      <g stroke="#1a120c" stroke-width="2.5" fill="#d9a441">
        <path d="M95 200 Q100 150 150 145 Q200 150 205 200 Z"/>
        <rect x="140" y="128" width="20" height="20"/>
        <ellipse cx="150" cy="110" rx="22" ry="25"/>
        <circle cx="150" cy="82" r="10"/>
        <path d="M128 112 q-6 14 2 22 M172 112 q6 14 -2 22" fill="none"/>
        <ellipse cx="150" cy="185" rx="26" ry="9"/>
      </g>
      <path d="M140 108 q4 3 8 0 M152 108 q4 3 8 0" stroke="#1a120c" stroke-width="2" fill="none"/>
      <path d="M145 121 q5 3 10 0" stroke="#1a120c" stroke-width="2" fill="none"/>
      <circle cx="150" cy="99" r="1.8" fill="#1a120c"/>
      <!-- 연꽃 좌대 -->
      <g stroke="#1a120c" stroke-width="2" fill="#e8a3a0">
        <path d="M88 200 q15 -18 30 0 q15 -18 32 0 q17 -18 32 0 q15 -18 30 0 Z"/>
        <rect x="92" y="200" width="116" height="12" fill="#7a3a28"/>
      </g>
      <!-- 불단 -->
      <rect x="40" y="212" width="220" height="34" fill="#5b2a1a" stroke="#1a120c" stroke-width="2"/>
      <!-- 명패 -->
      <g stroke="#1a120c" stroke-width="2">
        <rect x="80" y="214" width="50" height="28" rx="2" fill="#2b1a10"/><rect x="84" y="218" width="42" height="20" fill="#e9d9b0"/>
        <rect x="170" y="214" width="50" height="28" rx="2" fill="#2b1a10"/><rect x="174" y="218" width="42" height="20" fill="#e9d9b0"/>
      </g>
      <text x="105" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1a120c">Robiin</text>
      <text x="195" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1a120c">Dokdo</text>
      <!-- 촛불 -->
      <g stroke="#1a120c" stroke-width="1.5">
        <rect x="62" y="194" width="8" height="18" fill="#f3e6c8"/><path class="flame" d="M66 182 q-5 7 0 12 q5 -5 0 -12" fill="#f0b23a" style="transform-origin:66px 194px"/>
        <rect x="230" y="194" width="8" height="18" fill="#f3e6c8"/><path class="flame" d="M234 182 q-5 7 0 12 q5 -5 0 -12" fill="#f0b23a" style="transform-origin:234px 194px"/>
      </g>
      <!-- 향로와 연기 -->
      <path d="M138 212 h24 l-4 -10 h-16 z" fill="#3b3b3b" stroke="#1a120c" stroke-width="1.5"/>
      <line x1="150" y1="202" x2="150" y2="186" stroke="#7a3a28" stroke-width="1.5"/>
      <path class="smoke" d="M150 184 q-6 -8 0 -16 q6 -8 0 -16" stroke="#b9a27a" stroke-width="1.5" fill="none"/>
      <!-- 바닥(방석) -->
      <rect x="0" y="246" width="300" height="69" fill="#6b4a2e"/>
      <line x1="0" y1="246" x2="300" y2="246" stroke="#1a120c" stroke-width="3"/>
      <ellipse cx="150" cy="292" rx="44" ry="10" fill="#8e2a1c" stroke="#1a120c" stroke-width="2"/>
      <!-- 절하는 사람(뒷모습) — 그림 4장을 갈아 끼운다 -->
      <g id="p0" stroke="#1a120c" stroke-width="2.5" fill="#f3e6c8">
        <rect x="134" y="226" width="32" height="62" rx="8"/><circle cx="150" cy="214" r="13" fill="#2a1d14"/>
        <path d="M134 238 l-8 22 M166 238 l8 22" fill="none"/>
      </g>
      <g id="p1" style="display:none" stroke="#1a120c" stroke-width="2.5" fill="#f3e6c8">
        <rect x="134" y="222" width="32" height="40" rx="8"/><circle cx="150" cy="210" r="13" fill="#2a1d14"/>
        <path d="M134 226 q-10 -10 4 -18 M166 226 q10 -10 -4 -18" fill="none"/>
        <ellipse cx="150" cy="282" rx="26" ry="10"/>
      </g>
      <g id="p2" style="display:none" stroke="#1a120c" stroke-width="2.5" fill="#f3e6c8">
        <ellipse cx="150" cy="276" rx="30" ry="14"/><circle cx="150" cy="258" r="12" fill="#2a1d14"/>
        <path d="M122 268 l-14 -6 M178 268 l14 -6" fill="none"/>
      </g>
      <g id="p3" style="display:none" stroke="#1a120c" stroke-width="2.5" fill="#f3e6c8">
        <ellipse cx="150" cy="280" rx="32" ry="12"/><circle cx="150" cy="270" r="11" fill="#2a1d14"/>
        <path d="M118 278 q-6 -10 2 -12 l-6 -4 M182 278 q6 -10 -2 -12 l6 -4" fill="none"/>
      </g>
      <!-- 염주 108알 -->
      <g id="beads"></g>
    </svg>
  </div>
  <div id="cnt">0<small> / 108</small></div>
  <div id="msg">「절 올리기」를 누르세요</div>
  <div class="row">
    <button class="btn" id="bow">🙇 절 올리기</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn ghost" id="auto">자동 절</button>
    <button class="btn ghost" id="snd">소리 켬</button>
    <button class="btn ghost" id="reset">처음부터</button>
  </div>
  <div id="live"></div>
  <div style="width:100%;margin-top:14px">
    <div class="row" style="flex-wrap:nowrap"><input id="wish" maxlength="100" placeholder="부처님께 올릴 기도 한 줄" style="flex:1;min-width:0;font-size:16px;padding:10px;border-radius:10px;border:2px solid var(--gold);background:#000;color:var(--paper);font-family:inherit"><button class="btn" id="wishGo" style="font-size:16px;padding:8px 14px">올리기</button></div>
    <div id="wishes" style="margin-top:10px;font-size:14px;line-height:1.6"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
const PW_HASH = "1f37fc50627a0ba00603f8b345bc63cf9fdec791288e82cfbec5396e55321b46";
async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
async function tryPw() {
  const nk = $("nick").value.trim();
  if (!nk) { $("bad").textContent = "아이디를 넣어 주세요"; return; }
  if (await sha($("pw").value.trim()) === PW_HASH) { store.set("pray_nick", nk); NICK = nk; try { sessionStorage.setItem("pray_ok", "1"); } catch (e) {} open(); }
  else $("bad").textContent = "비밀번호가 다릅니다";
}
let NICK = store.get("pray_nick") || ""; $("nick").value = NICK;
$("go").onclick = tryPw; $("nick").onkeydown = e => { if (e.key === "Enter") $("pw").focus(); }; $("pw").onkeydown = e => { if (e.key === "Enter") tryPw(); };
// 염주 108알
const B = $("beads"), NS = "http://www.w3.org/2000/svg";
for (let i = 0; i < 108; i++) {
  const a = -Math.PI / 2 + i / 108 * Math.PI * 2, c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", 150 + 140 * Math.cos(a) * .98); c.setAttribute("cy", 160 + 148 * Math.sin(a) * .98); c.setAttribute("r", 3);
  c.setAttribute("fill", "#3a2a1c"); c.setAttribute("stroke", "#1a120c"); B.appendChild(c);
}
const beads = [...B.children];

const today = () => { const d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); };
let n = 0, busy = false, auto = null, sound = store.get("pray_snd") !== "0";
const saved = (store.get("pray_day") || "").split(":"); if (saved[0] === today()) n = Math.min(108, +saved[1] || 0);
function draw() {
  $("cnt").innerHTML = n + "<small> / 108</small>";
  beads.forEach((b, i) => b.setAttribute("fill", i < n ? "#d9a441" : "#3a2a1c"));
  store.set("pray_day", today() + ":" + n);
}
$("snd").textContent = sound ? "소리 켬" : "소리 끔";

// 소리: 목탁(나무 똑) · 108배 끝나면 싱잉볼(종)
let AC = null;
const ac = () => AC || (AC = new (window.AudioContext || window.webkitAudioContext)());
function moktak() {
  if (!sound) return; const c = ac(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(820, t); o.frequency.exponentialRampToValueAtTime(560, t + .12);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.7, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + .25);
}
function bell() {
  if (!sound) return; const c = ac(), t = c.currentTime;
  [[220, .5], [442, .25], [663, .15], [1190, .06]].forEach(([f, v]) => {
    const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 6);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + 6.2);
  });
}

const MSG = {1: "첫 배 — 오늘도 이 자리에 왔습니다", 27: "스물일곱 배 — 숨을 고르세요", 54: "쉰네 배 — 절반을 넘었습니다", 81: "여든한 배 — 조금만 더", 100: "백 배 — 남은 여덟 배", 108: "🙏 백팔배를 마쳤습니다. 마음이 편안하시기를"};
const pose = k => { for (let i = 0; i < 4; i++) $("p" + i).style.display = i === k ? "" : "none"; };
const wait = ms => new Promise(r => setTimeout(r, ms));
async function bow() {
  if (busy || n >= 108) return; busy = true;
  // 서기 → 무릎 → 이마 닿기(목탁) → 손 받들기 → 일어서기 (뚝뚝 끊어 움직임)
  pose(1); await wait(330); pose(2); await wait(260); moktak(); pose(3); await wait(420); pose(2); await wait(260); pose(1); await wait(300); pose(0);
  n++; draw(); if (MSG[n]) $("msg").textContent = MSG[n]; else $("msg").textContent = n + "배";
  sendBow();
  if (n >= 108) { bell(); stopAuto(); }
  busy = false;
}
function stopAuto() { clearInterval(auto); auto = null; $("auto").textContent = "자동 절"; }
$("bow").onclick = bow;
document.addEventListener("keydown", e => { if (e.code === "Space" && !$("app").hidden) { e.preventDefault(); bow(); } });
$("auto").onclick = () => { if (auto) return stopAuto(); auto = setInterval(bow, 2400); bow(); $("auto").textContent = "자동 멈춤"; };
$("snd").onclick = () => { sound = !sound; store.set("pray_snd", sound ? "1" : "0"); $("snd").textContent = sound ? "소리 켬" : "소리 끔"; };
$("reset").onclick = () => { if (!confirm("오늘 센 절을 0으로 돌릴까요?")) return; stopAuto(); n = 0; draw(); $("msg").textContent = "처음부터 다시"; };

// 함께: 지금 법당에 있는 사람 · 오늘 모두 올린 절(채팅과 같은 Firebase). 안 되면 혼자 세기만
let DB = null, uid = "";
async function sendBow() { if (!DB) return; try { await DB.ref("pray/day/" + today()).transaction(v => (v || 0) + 1); if (n >= 108) DB.ref("pray/done/" + today()).transaction(v => (v || 0) + 1); } catch (e) {} }
async function together() {
  try {
    firebase.initializeApp({apiKey: "AIzaSyBYLf6m03K2-bJeuJuV9cf67cFRv_1czfU", authDomain: "chat1108-d4d5f.firebaseapp.com", databaseURL: "https://chat1108-d4d5f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "chat1108-d4d5f"});
    await firebase.auth().signInAnonymously(); uid = firebase.auth().currentUser.uid;
    DB = firebase.database();
    const me = DB.ref("pray/here/" + uid); await me.set({n: NICK.slice(0, 20), t: firebase.database.ServerValue.TIMESTAMP}); me.onDisconnect().remove();
    let here = 0, all = 0, done = 0;
    let names = [];
    const show = () => { $("live").innerHTML = `지금 법당에 <b>${here}</b>명${names.length ? " (" + names.map(esc).join(", ") + ")" : ""}<br>오늘 모두 올린 절 <b>${all.toLocaleString()}</b>배 · 백팔배 마친 분 <b>${done}</b>`; };
    DB.ref("pray/here").on("value", s => { const v = s.val() || {}; here = Object.keys(v).length; names = [...new Set(Object.values(v).map(x => (x && x.n) || "").filter(Boolean))]; show(); });
    DB.ref("pray/wish").limitToLast(30).on("value", s => {
      const v = Object.values(s.val() || {}).sort((a, b) => b.t - a.t);
      $("wishes").innerHTML = v.map(w => `<div style="border-bottom:1px solid #3a2a1c;padding:4px 0">🪷 <b style="color:var(--gold)">${esc(w.n)}</b> ${esc(w.m)}</div>`).join("") || '<div style="color:var(--muted)">아직 올린 기도가 없습니다</div>';
    });
    DB.ref("pray/day/" + today()).on("value", s => { all = s.val() || 0; show(); });
    DB.ref("pray/done/" + today()).on("value", s => { done = s.val() || 0; show(); });
  } catch (e) { DB = null; $("live").textContent = ""; }
}
const esc = t => String(t || "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
async function wish() {
  const m = $("wish").value.trim(); if (!m) return;
  if (!DB) { $("msg").textContent = "기도를 마음에 담았습니다 🙏"; $("wish").value = ""; return; }
  try { await DB.ref("pray/wish").push({n: NICK.slice(0, 20), m: m.slice(0, 100), t: firebase.database.ServerValue.TIMESTAMP}); $("wish").value = ""; $("msg").textContent = "기도를 올렸습니다 🙏"; bell(); }
  catch (e) { $("msg").textContent = "기도를 못 올렸습니다(다시)"; }
}
$("wishGo").onclick = wish; $("wish").onkeydown = e => { if (e.key === "Enter") wish(); };
function open() { $("gate").remove(); $("app").hidden = false; $("who").textContent = NICK + " 님"; draw(); together(); }
try { if (sessionStorage.getItem("pray_ok") && NICK) open(); } catch (e) {}
</script>
</body>
</html>
