<title>온라인 기도</title>
<style>
:root{--bg:#14110d;--wall:#3a1f16;--red:#8e2a1c;--gold:#d9a441;--ink:#1a120c;--paper:#f3e6c8;--muted:#b9a27a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:"Noto Serif KR","Nanum Myeongjo",serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:9}
#gate input{font-size:20px;padding:10px 14px;border-radius:10px;border:2px solid var(--gold);background:#000;color:var(--paper);text-align:center;width:200px}
#gate button,.btn{font-size:18px;padding:10px 22px;border-radius:12px;border:2px solid var(--ink);background:var(--gold);color:var(--ink);font-weight:700;cursor:pointer;font-family:inherit}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 16px 24px}
h1{font-size:22px;margin:6px 0 2px;color:var(--gold);letter-spacing:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
#hall{position:relative;width:100%;aspect-ratio:480/348;max-height:72vh;background:var(--wall);border:4px solid var(--ink);border-radius:6px;overflow:hidden}
#hall svg{position:absolute;inset:0;width:100%;height:100%}
#cnt{font-size:44px;font-weight:800;color:var(--gold);margin-top:10px;line-height:1}
#cnt small{font-size:18px;color:var(--muted)}
#msg{min-height:22px;color:var(--paper);font-size:15px;margin:6px 0 10px;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#bow{font-size:22px;padding:14px 40px}
.btn.ghost{background:transparent;color:var(--gold);border-color:var(--gold);font-size:15px;padding:8px 14px}
#live{margin-top:14px;font-size:13px;color:var(--muted);text-align:center;line-height:1.7}
.lang{display:flex;gap:6px;justify-content:center;margin:4px 0}.lang button{font:inherit;font-size:13px;padding:3px 10px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}.lang button.on{background:var(--gold);color:var(--ink)}
.smoke{animation:smoke 4s steps(12) infinite;transform-origin:center}
@keyframes smoke{0%{opacity:0;transform:translateY(0)}20%{opacity:.6}100%{opacity:0;transform:translateY(-40px)}}
.flame{animation:fl 1s steps(4) infinite}
@keyframes fl{50%{transform:scaleY(.8)}}
</style>
</head>

  <input id="pw" type="password" inputmode="text" autocomplete="off" data-ip="pw">

  <div id="bad" style="color:#e66;min-height:20px"></div>

const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
const PW_HASH = "1f37fc50627a0ba00603f8b345bc63cf9fdec791288e82cfbec5396e55321b46";
async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
async function tryPw() {
  const nk = $("nick").value.trim();
  if (!nk) { $("bad").textContent = t("noNick"); return; }
  if (await sha($("pw").value.trim()) === PW_HASH) { store.set("pray_nick", nk); NICK = nk; try { sessionStorage.setItem("pray_ok", "1"); } catch (e) {} open(); }
  else $("bad").textContent = t("badPw");
}
let NICK = store.get("pray_nick") || ""; $("nick").value = NICK;
$("go").onclick = tryPw; $("nick").onkeydown = e => { if (e.key === "Enter") $("pw").focus(); }; $("pw").onkeydown = e => { if (e.key === "Enter") tryPw(); };
// 염주 108알
const B = $("beads"), NS = "http://www.w3.org/2000/svg";
for (let i = 0; i < 108; i++) {
  const a = -Math.PI / 2 + i / 108 * Math.PI * 2, c = document.createElementNS(NS, "circle");

  c.setAttribute("fill", "#3a2a1c"); c.setAttribute("stroke", "#1a120c"); B.appendChild(c);
}
const beads = [...B.children];
$("people").before(B);   // 염주는 사람 뒤로

    const head = `<button data-d="${d}" style="width:100%;text-align:left;font:inherit;font-size:15px;padding:6px 8px;margin-top:4px;border-radius:8px;border:1px solid var(--gold);background:${op ? "var(--gold)" : "transparent"};color:${op ? "var(--ink)" : "var(--gold)"};cursor:pointer">${op ? "▾" : "▸"} 📅 ${+d.slice(4, 6)}/${+d.slice(6)} · ${v.length}${bk("p")} · 🏅${v.filter(x => x.f).length}</button>`;
    return head + (op ? v.map(x => `<div style="display:flex;gap:6px;border-bottom:1px solid #3a2a1c;padding:3px 4px"><span style="flex:1;min-width:0">🖋 <b style="color:var(--gold)">${esc(x.n)}</b> · ${x.c || 0}${bk("bows")}${x.f ? ' <span style="font-size:11px;background:var(--gold);color:var(--ink);border-radius:8px;padding:0 6px;font-weight:700">' + esc(t("fin")) + '</span>' : ""}</span><span style="color:var(--muted);font-size:12px">${hm(x.t)} ${bk("came")}</span></div>`).join("") : "");
  }).join("");
  $("guests").querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const d = b.dataset.d; OPEN.has(d) ? OPEN.delete(d) : OPEN.add(d); drawBook(); });
}
$("sign").onclick = async () => {
  if (!DB) { $("guests").innerHTML = '<div style="color:var(--muted)">' + t("noBook") + '</div>'; return; }
  $("sign").disabled = true;
  try { await bookTouch(); $("sign").textContent = t("signed"); }
  catch (e) { $("sign").disabled = false; $("sign").textContent = t("signAgain"); }
};
const when = t => { const d = new Date(t), p = x => String(x).padStart(2, "0"); return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes()); };
applyLang();
try { if (sessionStorage.getItem("pray_ok") && NICK) open(); } catch (e) {}
</script>
