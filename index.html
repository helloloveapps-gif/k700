<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>700서버 KvK 참여 현황</title>
<style>
:root{--bg:#e9edf7;--card:#fff;--ink:#1c2230;--sub:#667085;--line:#e3e6ec;--accent:#3b5bdb;--ok:#2f9e44;--warn:#e8590c;--bar:#dfe4f3}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--ink:#e8ebf2;--sub:#98a2b3;--line:#2b3242;--accent:#7b93ff;--ok:#51cf66;--warn:#ff922b;--bar:#2a3145}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--sub);font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.section{margin-bottom:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:13px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.dot{color:var(--ok);font-weight:700}
.no{color:var(--line)}
tr.bad td{background:rgba(224,49,49,.10);color:#c92a2a;text-decoration:line-through;text-decoration-color:#e03131;text-decoration-thickness:2px}
tr.bad td:first-child{box-shadow:inset 4px 0 0 #e03131}
#badBox{border:2px solid #e03131}
#badBox>h2{border-inline-start-color:#e03131;color:#e03131}
#absBox{border:2px solid #868e96}
#eForm input.k{width:130px;text-align:start;font-weight:700}
#eMsg:empty{display:none}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.eg h3{margin:0 0 8px;font-size:14px}
.ebar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.ebar .el{flex:none;width:44px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebar .et{flex:1;min-width:0;height:16px;background:var(--bar);border-radius:6px;overflow:hidden;display:flex}
.ebar .et i{display:block;height:100%;border-radius:6px}
.ebar .stk{display:flex;height:100%;gap:1px;border-radius:6px;overflow:hidden}
.ebar .stk i{border-radius:0;color:#fff;font-size:10px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;min-width:2px}
.ebar .ev{flex:none;min-width:64px;text-align:end;font-weight:700;font-variant-numeric:tabular-nums}
.ebar .ev small{color:var(--sub);font-weight:400}
.esub{margin:-2px 0 6px 52px;font-size:11px;color:var(--sub)}
.elg{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-bottom:4px;flex-wrap:wrap}
.elg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:3px;vertical-align:-1px}
.ecol{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.ecol>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:11px}
.ecol span{display:block;width:100%;max-width:46px;background:linear-gradient(#c92a2a,#f76707);border-radius:6px 6px 0 0;min-height:2px}
.ecol small{color:var(--sub);white-space:nowrap}
#eList{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
#eList button{min-height:32px;padding:0 12px;font-size:13px}
#eList button.on{background:#c92a2a;border-color:#c92a2a;color:#fff}
#eBody .card{margin-top:12px}
#eBody .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub);margin-bottom:8px}
#eBody .meta b{color:var(--ink)}
#eBody .ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
#eBody td.rk{color:var(--sub);text-align:end}
@media (max-width:600px){#eForm input.k{flex:1 1 100%;width:auto}}
#absBox>h2{border-inline-start-color:#868e96;color:#868e96}
.hist td,.hist th{white-space:nowrap}
.hist tr.now td{background:rgba(64,192,87,.10);font-weight:700}
.hist .chg{color:#f76707;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.62);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
.mbox{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:680px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.mbox.wide{max-width:820px;padding:14px}
#popFrame{display:block;width:100%;height:calc(100vh - 130px);min-height:420px;border:0;border-radius:10px;background:#fff}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{margin:0;font-size:19px;color:#e8590c}
.warmap{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:16px auto;border-radius:50%;border:2px dashed var(--line);background:radial-gradient(circle,var(--bar) 0,var(--bar) 60%,transparent 61%)}
.warmap .castle{position:absolute;left:50%;top:50%;width:58%;height:58%;transform:translate(-50%,-50%);object-fit:contain;border-radius:14px}
.warmap .ph{display:none;align-items:center;justify-content:center;font-size:96px}
.warmap .castle[hidden]+.ph{display:flex}
.hr{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.hn{width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hr.on .hn{background:#f59f00;border-color:#f59f00;color:#fff}
.hr .tag{font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.warset select{padding:5px 8px}
.lcard{border:1px solid var(--line);border-inline-start:4px solid #f59f00;border-radius:10px;padding:10px;margin-top:10px;background:var(--card)}
.lhead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.lhead .sp{flex:1}
.lrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:13px}
.lrow>b{min-width:124px}
.need.bad{color:#fff;background:var(--warn);border-radius:8px;padding:6px 10px}
.need{flex:1 1 100%;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
details.tt{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--card);overflow:hidden}
details.tt>summary{cursor:pointer;padding:9px 12px;background:var(--bar);font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
details.tt>summary small{font-weight:400;color:var(--sub);font-size:12px}
details.tt>summary .fill{margin-inline-start:auto;font-size:12px;font-weight:700}
details.tt.away>summary{font-weight:400;color:var(--sub)}
.tb{border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden;background:var(--card)}
.tb .th{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:6px 10px;background:var(--bar);font-weight:700;font-size:13px}
.tb .th small{font-weight:400;color:var(--sub);font-size:11px}
.tb .th .fill{margin-inline-start:auto;font-size:12px}
.tb.away{border-style:dashed}
.tb.away .th{background:none;font-weight:400;color:var(--sub)}
.ttl .tr{display:flex;flex-wrap:nowrap;align-items:center;gap:0 10px;padding:4px 10px;border-top:1px solid var(--line);font-size:12.5px}
.ttl .amt{margin-inline-start:auto;text-align:end;flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.ttl .amt b{margin-inline-start:6px}
.ttl .tr.own{background:rgba(245,159,0,.10)}
.ttl .tr.sum{background:var(--bar);font-weight:700}
.ttl .tr small{color:var(--accent);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:1 1 100%;min-width:0}
.fgrid label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;min-width:0;white-space:nowrap}
.fgrid input{flex:1 1 0;min-width:0;width:0 !important;padding:0 6px}
.lrow.form>b{flex:1 1 100%}
.adminbox label.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.ltabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ltab{min-height:36px;padding:0 12px;border-radius:99px;font-size:13px}
.ltab.on{background:#f59f00;border-color:#f59f00;color:#fff}
.ltab.cf{border:2px solid #2f9e44;color:#2f9e44;font-weight:800}
.ltab.cf.on{background:#2f9e44;border-color:#2f9e44;color:#fff}
.cfbox{margin:6px 0 10px;border:2px solid #2f9e44;border-radius:12px;padding:6px 10px;background:var(--card)}
.cfbox>summary{cursor:pointer;font-weight:800;color:#2f9e44;padding:4px 0}
.cfrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);flex-wrap:nowrap;font-size:13px}
.cfrow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfrow .sub{flex:none;white-space:nowrap;font-size:12px}
.cfrow button{flex:none}
.no1{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bar);font-style:normal;font-size:12px;font-weight:800}
.cfrow.on .no1{background:#2f9e44;color:#fff}
.rbar .cfb{margin:0}
.rbar:empty,.rbar:has(> b:empty:only-child){display:none}
.cfrow.on .nm b{color:#2f9e44}
.cfrow button{min-height:32px;padding:0 12px;font-size:13px}
.cfb{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;background:#2f9e44;color:#fff;vertical-align:middle;margin-inline-start:6px}
.cfb.no{background:transparent;color:var(--sub);border:1px dashed var(--sub);font-weight:600}
.card.leader.cf,.lcard.cf{border:3px solid #2f9e44 !important;background:linear-gradient(rgba(47,158,68,.07),rgba(47,158,68,.07)),var(--card)}
#aConf.off{background:#2f9e44;border-color:#2f9e44;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.stats>div{background:var(--bar);border-radius:10px;padding:8px;min-width:0}
.stats small{display:block;color:var(--sub);font-size:11px;line-height:1.2;min-height:1.2em}
.stats b{font-size:15px;font-variant-numeric:tabular-nums}
.stats input{width:100% !important;min-width:0;min-height:30px !important;padding:0 6px !important;font-weight:700;font-size:15px}
.stats .hot{background:rgba(245,159,0,.18)}
#repText{display:block;width:100%;height:58vh;min-height:240px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bar);color:var(--ink);font:13px/1.55 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;white-space:pre;overflow:auto;resize:vertical}
.arow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.arow label{display:flex;align-items:center;gap:6px;margin:0}
#aReset{color:var(--warn);border-color:var(--warn)}
#inapp{display:none;background:#fff3bf;color:#5c3c00;border:2px solid #f59f00;border-radius:12px;padding:12px;margin-bottom:12px;font-weight:600}
#inapp button{margin-top:8px;background:#f59f00;border-color:#f59f00;color:#fff;width:100%}
#inapp small{display:block;margin-top:6px;font-weight:400}
.who{min-height:0;padding:0;border:none;border-radius:0;background:none;font:inherit;font-weight:700;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.who:hover{color:var(--accent)}
#roleBody h3{margin:14px 0 4px;font-size:15px}
#aConf{background:var(--ok);border-color:var(--ok);color:#fff}
#aConf.off{background:none;color:var(--sub);border-color:var(--line)}
#meBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:2px solid #7950f2;border-radius:12px;padding:10px 12px;margin-bottom:12px}
#meBar b.t{color:#7950f2;white-space:nowrap}
#meBar input{flex:1 1 180px;min-width:0;text-align:start}
#meBar .sub{flex:1 1 100%;font-size:12px}
#meBar .who2{font-weight:700}
#meBar .sp{flex:1}
#meTodo{display:flex;flex-direction:column;gap:6px;margin:-4px 0 12px}
#meTodo:empty{display:none}
#meTodo .todo{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px dashed #f76707;border-radius:12px;background:rgba(247,103,7,.08);font-size:13px;font-weight:700}
#meTodo .todo span{flex:1;min-width:0}
#meTodo .todo button{flex:none;min-height:34px;padding:0 12px;font-size:13px;background:#f76707;border-color:#f76707;color:#fff}
/* 응답자 명단: 칸마다 테두리, 바깥 테두리, 줄무늬로 사람마다 구분 */
.respwrap{border:2px solid var(--line);border-radius:10px;overflow:auto}
#respTable{border-collapse:collapse}
#respTable th,#respTable td{border:1px solid var(--line)}
#respTable tr:first-child th{border-top:none}
#respTable th:first-child,#respTable td:first-child{border-inline-start:none}
#respTable th:last-child,#respTable td:last-child{border-inline-end:none}
#respTable tr:last-child td{border-bottom:none}
#respTable tr:nth-child(even) td{background:rgba(127,127,127,.06)}
#respTable tr.mine td{background:rgba(121,80,242,.16)}
#meBar.in{flex-wrap:nowrap;padding:8px 10px}
#meBar.in .who2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meBar.in button{flex:none;min-height:34px;padding:0 12px;font-size:13px}
#meRole{background:#7950f2;border-color:#7950f2;color:#fff;font-weight:800}
tr.mine td{background:rgba(121,80,242,.16)}
.modebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.tw{position:absolute;transform:translate(-50%,-50%);z-index:3;min-width:30px;height:26px;padding:0 7px;border-radius:99px;border:2px dashed #ff6b6b;background:rgba(224,49,49,.28);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;white-space:nowrap}
.tw.on{border-style:solid;background:rgba(224,49,49,.85)}
.tw.hot{outline:3px solid #ffd43b}
.hr{z-index:4}
.bub{position:absolute;transform:translate(-50%,-50%);z-index:5;width:24px;height:24px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.bub.set{outline:2px solid #ffd43b}
.hr .tag[data-a]{cursor:pointer}
.bubtip{white-space:pre-line;text-align:start;position:absolute;z-index:6;transform:translate(-50%,-120%);background:var(--ink);color:var(--card);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}
.hr .tag.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.warset input.memo{width:200px;text-align:start}
.fbox{background:var(--bar);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fgrp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.fgrp b{min-width:36px}
.fgrp select{padding:5px 8px}
.chip{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;color:var(--sub)}
.chip.on{color:#fff}
.chip.on.t10{background:#f59f00;border-color:#f59f00}
.chip.on.t11{background:#e03131;border-color:#e03131}
.pager{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pager button{padding:4px 11px;font-size:14px}
.pager button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}
.badtag{display:inline-block;text-decoration:none;background:#e03131;color:#fff;border-radius:4px;padding:0 6px;font-size:11px;font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--bar);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.msg{padding:14px;border-radius:10px;background:var(--bar);margin-bottom:16px}
.msg.err{border:1px solid var(--warn)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.star{border:none;background:none;padding:0 4px;font-size:18px;color:var(--sub)}
.star.on{color:#f59f00}
.adminbox{border:2px dashed #f59f00;border-radius:12px;padding:14px;margin-bottom:14px}
.adminbox input{width:96px;padding:5px 8px;text-align:right}
.adminbox input.pc{width:58px}
.adminbox input.name{width:130px;text-align:start}
.adminbox button.del{padding:3px 10px;font-size:13px}
table.plan th,table.plan td{padding:6px 8px;font-size:13px}
table.plan tr.own td{background:rgba(245,159,0,.10)}
table.plan tr.sum td{font-weight:700;background:var(--bar)}
.short{color:var(--warn);font-size:12px}
td.march{line-height:1.25}
td.march small{color:var(--sub);font-size:11px}
.hero{background:linear-gradient(120deg,#1b2a80 0%,#5f3dc4 55%,#d6336c 100%);color:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 6px 20px rgba(60,40,160,.25)}
.hero h1{font-size:24px}
.hero .sub{color:rgba(255,255,255,.85)}
.hero button{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}
.hero button.primary{background:#ffd43b;border-color:#ffd43b;color:#1c2230;font-weight:700}
.card{box-shadow:0 2px 8px rgba(30,40,90,.06)}
.card.total{background:linear-gradient(135deg,#3b5bdb,#7950f2);border:none;color:#fff}
.card.total .sub{color:rgba(255,255,255,.85)}
.card.total .bar{background:rgba(255,255,255,.3)}
.card.total .bar>i{background:#ffd43b}
.section>h2{border-inline-start:5px solid var(--accent);padding-inline-start:10px}
h2.slot{background:var(--bar);border-inline-start:5px solid #f59f00;border-radius:6px;padding:6px 10px}
th{background:var(--bar)}
th small{font-weight:400}
tr:hover td{background:rgba(121,80,242,.06)}
.dot.full{color:#f59f00}
.tier{display:inline-block;min-width:34px;padding:1px 6px;border-radius:6px;font-weight:700;font-size:13px;background:var(--bar)}
.tier.t11{background:#e03131;color:#fff}
.tier.t10{background:#f59f00;color:#fff}
.tier.t9{background:#2f9e44;color:#fff}
.troopline{font-size:13px;margin:4px 0}
.card.leader{border-inline-start:5px solid #f59f00;background:linear-gradient(180deg,rgba(245,159,0,.10),transparent 60%),var(--card)}
.lname{font-weight:700;font-size:16px;color:#e8590c}
.names small{color:var(--accent);font-weight:700}
.msg{border-inline-start:5px solid var(--accent)}
.langs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.langs button{font-size:14px;padding:6px 12px;border-radius:99px}
.langs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.names span{background:var(--bar);border-radius:6px;padding:2px 8px;font-size:13px}
.names span.noid{background:none;border:1px dashed var(--sub);color:var(--sub)}
button{white-space:nowrap}
h1,h2,.sub,label,th,td,.msg{word-break:keep-all}
.mhead h2{flex:1;min-width:0;line-height:1.3}
.xbtn{flex:none;width:36px;height:36px;padding:0;border-radius:50%;font-size:16px;line-height:1}

  .section{margin-bottom:12px}

.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.topbar .langs{margin-bottom:0}
#menuBtn{display:flex;align-items:center;gap:8px;font-weight:700}
#menuBtn .ico{font-size:17px;line-height:1}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:250px;max-width:82vw;background:var(--card);padding:16px 12px;box-shadow:6px 0 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;font-size:17px;padding-inline-start:6px}
.drawer button.item{width:100%;text-align:start;min-height:46px;font-size:15px;border-color:transparent;background:none}
.drawer button.item.on{background:var(--accent);color:#fff}
.drawer button.item:hover{border-color:var(--line)}
input.pass{width:110px !important;text-align:start;font-weight:700}
.outbox{border:2px solid #e03131}
.dispbox{border:2px solid #7950f2}
.dispbox .tr{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.dispbox .tr .nmx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dispbox .tr button{flex:none;min-height:28px;padding:0 12px;font-size:12px}
.dchips{display:flex;gap:6px;margin:8px 0;flex-wrap:nowrap;overflow-x:auto}
.dchip{flex:none;min-height:32px;padding:0 14px;border-radius:99px;font-weight:800;border:2px solid var(--ac) !important;color:var(--ac) !important;background:var(--card) !important}
.dchip.on{background:var(--ac) !important;color:#fff !important}
.dtag{color:#7950f2;font-weight:700;font-size:10px}
.outbox .tr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.relb{min-height:28px !important;padding:0 12px !important;font-size:12px !important;background:#2f9e44 !important;border-color:#2f9e44 !important;color:#fff !important}
.swb{background:#fff4e6 !important;border-color:#f76707 !important;color:#d9480f !important}
.swp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;margin:6px 0;padding:8px;border:2px solid #f76707;border-radius:10px;background:rgba(247,103,7,.08)}
.swp select{flex:1 1 200px;min-width:0}
.swp button{min-height:32px;padding:0 12px;font-size:13px}
.ttl .lb{display:flex;flex-wrap:nowrap;align-items:center;min-width:0;flex:1 1 auto}
.ttl .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:100%}
.ttl .tr:has(.swp),.ttl .lb:has(.swp){flex-wrap:wrap}
.ttl .lb .outb{flex:none !important}
.outb{min-height:0 !important;height:22px;padding:0 8px !important;margin-inline-start:6px;font-size:11px !important;border-radius:6px;background:#fff0f0;border:1px solid #e03131 !important;color:#e03131 !important;flex:none !important}
.pgrp{display:flex;gap:6px;align-items:center;padding:6px;border:2px solid #7950f2;border-radius:12px;background:rgba(121,80,242,.08)}
.ogrp{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.pgrp{flex:1 1 100%;min-width:0}.pgrp input.pass{flex:1 1 0;width:0 !important;min-width:0}.pgrp button{flex:none !important;padding:0 8px;font-size:13px}.ogrp{flex:1 1 100%}.ogrp button{flex:1}}
/* 시간대별 막대그래프 */
.chart{display:flex;align-items:flex-end;gap:8px;margin-top:4px}
.col{flex:1;min-width:0;position:relative;outline:none}
.col .plot{height:178px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--line)}
.col .val{font-weight:700;font-size:14px;margin-bottom:4px}
.col .stack{width:70%;max-width:46px;display:flex;flex-direction:column-reverse;gap:2px}
.col .stack i{display:block}
.col .stack i:last-child{border-radius:4px 4px 0 0}
.col:hover .stack,.col:focus .stack{filter:brightness(1.12)}
.col .xl{margin-top:6px;text-align:center;line-height:1.25;font-size:12px;font-weight:700}
.col .xl small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.col .tip{display:none;position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:5;background:var(--ink);color:var(--card);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none}
.col:first-child .tip{left:0;transform:none}
.col:last-child .tip{left:auto;right:0;transform:none}
.col:hover .tip,.col:focus .tip{display:block}
.tip i,.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
details.tbl{margin-top:12px}
details.tbl summary{cursor:pointer;color:var(--sub);font-size:13px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:460px;margin-bottom:12px;padding:4px;background:var(--bar);border-radius:12px}
.seg button{min-height:32px;padding:0 2px;border:none;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff}
/* 연맹 고르기는 노란 칸으로 눈에 띄게, 병과 필터는 색 딱지로 구분: 보병 파랑 · 기병 주황 · 궁병 초록 */
#fAlly{border:2px solid #f08c00;background:#ffd43b;color:#1c2230;font-weight:800}
#fAlly option{background:var(--card);color:var(--ink);font-weight:400}
.fgrp.k0{border:2px solid #1c7ed6;background:rgba(28,126,214,.20)}
.fgrp.k1{border:2px solid #e8590c;background:rgba(232,89,12,.20)}
.fgrp.k2{border:2px solid #2f9e44;background:rgba(47,158,68,.20)}
.fgrp>b{color:#fff !important;border-radius:8px;padding:4px 10px;min-width:0;text-align:center}
.fgrp.k0>b{background:#1c7ed6}
.fgrp.k1>b{background:#e8590c}
.fgrp.k2>b{background:#2f9e44}
.fgrp.k0 select{border-color:#1c7ed6}
.fgrp.k1 select{border-color:#e8590c}
.fgrp.k2 select{border-color:#2f9e44}
#fName{border:2px solid #f59f00;background:rgba(255,212,59,.18);font-weight:600}
#fName::placeholder{color:#e8590c;opacity:1}
/* 단추 · 입력칸 크기 통일 */
button,select,input{min-height:40px;border-radius:10px;padding:0 14px;font-size:14px}
button{font-weight:600}
select,input{padding:0 10px}
.top .acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.top .acts button{width:100%;white-space:normal;line-height:1.2}
.star{min-height:0;padding:0 4px}
.chip{min-height:30px;padding:0 13px}
.pager button{min-height:34px;min-width:34px;padding:0 10px}
.fgrp select,.warset select{min-height:34px;padding:0 8px}
.adminbox input{min-height:34px;padding:0 8px}
.adminbox button.del{min-height:30px;padding:0 10px}
.xbtn{min-height:36px;padding:0}
/* 언어 고르기: 한 줄 다섯 칸 */
.langs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:460px;margin-inline-start:auto;margin-bottom:12px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:visible}
.langs button{min-height:32px;padding:0 2px;border:none;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--sub)}
.langs button.on{background:var(--accent);color:#fff}
@media (max-width:600px){
  .topbar{margin-bottom:10px}
  .chart{gap:4px}
  .col .val{font-size:13px}
  .col .xl{font-size:11px}
  .col .xl small{font-size:10px}
  .seg{max-width:none}
  .topbar .langs{flex:1 1 100%;max-width:none;order:2}
  .langs{max-width:none;padding:4px}
  .langs button{padding:0 2px;font-size:12px}
  .top .acts{grid-auto-flow:row;grid-template-columns:1fr 1fr}
  .top .acts button{padding:0 6px}
  .pager button{padding:0 8px}
}

/* ── 집결 편성 화면 ── */
#rsec{--mc:#e8590c;--mc2:rgba(232,89,12,.10)}
#rsec.def{--mc:#1c7ed6;--mc2:rgba(28,126,214,.10)}
.rhead{display:flex;align-items:center;gap:10px}
.rhead h2{flex:1;min-width:0;margin:0 !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead select{flex:none;font-weight:800}
details.help{margin:8px 0 10px;font-size:13px}
details.help>summary{cursor:pointer;color:var(--sub);font-weight:700;list-style:none;display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:99px}
details.help>summary::-webkit-details-marker{display:none}
details.help[open]>summary{color:var(--accent);border-color:var(--accent)}
details.help>.sub{margin-top:8px;padding:10px 12px;background:var(--bar);border-radius:10px;line-height:1.55}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:4px 0 14px;border:2px solid var(--mc);border-radius:12px;overflow:hidden}
.mtab{min-height:44px;border:0 !important;border-radius:0 !important;background:var(--card) !important;color:var(--sub) !important;font-weight:800;font-size:15px}
.mtab.on{background:var(--mc) !important;color:#fff !important}
#rsec .adminbox{border:2px solid var(--mc);border-style:solid;background:var(--mc2);padding:0;overflow:hidden}
#rsec .adminbox>summary{cursor:pointer;list-style:none;padding:10px 14px;font-weight:800;color:var(--mc);font-size:15px;display:flex;align-items:center;gap:8px}
#rsec .adminbox>summary::-webkit-details-marker{display:none}
#rsec .adminbox>summary::after{content:"▾";margin-inline-start:auto;color:var(--sub)}
#rsec .adminbox:not([open])>summary::after{content:"▸"}
#rsec .adminbox>.abody{padding:0 14px 14px}
#rsec .adminbox details.help{margin-top:0}
.addrow{display:flex;gap:8px;align-items:center}
.addrow select{flex:1 1 auto;min-width:0}
.addrow button{flex:none}
.tb .th .tmw{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.tb .th .tmw .ptag{margin:0}
.tb.pet{border:2px solid #f76707;box-shadow:0 0 0 3px rgba(247,103,7,.18),0 4px 14px rgba(247,103,7,.25)}

.tb.pet .th small{color:rgba(255,255,255,.85)}
.tb.pet .th .fill{color:#fff !important}

.tb.pet .ttl .tr.own{background:rgba(247,103,7,.18)}
@keyframes petGlow{50%{box-shadow:0 0 14px rgba(255,255,255,1)}}
@media (max-width:480px){.outb .bt{display:none}.ttl .lb .outb{padding:0 6px !important;margin-inline-start:4px}}
.undob{margin-top:10px;width:100%;min-height:36px;font-size:13px;border:1px dashed var(--sub) !important;background:transparent !important;color:var(--sub) !important}
.replangs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto}
.replangs .rl{flex:none;min-height:30px;padding:0 10px;font-size:12px;border-radius:99px}
.replangs .rl.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mcopy{margin-inline-start:8px;min-height:28px;padding:0 10px;font-size:12px;vertical-align:middle;border-radius:99px}
.dsc{font-size:12px}
.dsc.no{opacity:.6}
.mv0{color:var(--sub);font-size:11px}
.mv1{color:#1c7ed6;font-weight:700}
.mv2{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:99px;background:#f76707;color:#fff;font-weight:800}

.mv1 small{color:#1c7ed6;opacity:.8}
.capline{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px}
.capin{width:120px !important;min-height:32px !important;font-weight:800;font-size:15px !important;text-align:end;border:2px solid var(--mc,#e8590c) !important;border-radius:8px}
.petrow{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px;border-radius:10px;background:rgba(247,103,7,.10);border:1px solid rgba(247,103,7,.35);font-size:13px;flex-wrap:wrap}
.petrow b{flex:none;color:#e8590c;white-space:nowrap}
.petrow select{flex:1 1 120px;min-width:0}
.petrow label{display:flex;flex-direction:column;flex:none;margin:0}
.petrow label small{font-size:10px;color:var(--sub);white-space:nowrap}
.petrow input{width:100px !important;min-height:30px !important}
.ptag{flex:none;font-size:11px;font-weight:800;color:#fff;background:#f76707;border-radius:99px;padding:1px 8px;margin-inline-start:6px}
.defrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;white-space:nowrap}
.defrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.defrow input{flex:none;width:110px !important}
#rsec .ltabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
#rsec .ltab{flex:none;white-space:nowrap}
#rsec .ltab.on{background:var(--mc);border-color:var(--mc)}
#rsec .ltab.cf.on{background:#2f9e44;border-color:#2f9e44}
#rsec .lcard{border-inline-start-color:var(--mc)}
#rsec .lhead{flex-wrap:nowrap}
#rsec .lhead .lname{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rsec .lhead button{flex:none}
#rsec .lhead .cfb,#rsec .lhead .ms{flex:none;white-space:nowrap;margin:0}
#rsec .lhead .ms{font-size:12px}
#rsec .stats input{font-size:14px !important}
#rsec .ltab b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.18);font-size:12px;margin-inline-end:2px}
#rsec .lname{color:var(--mc)}
#rsec .card.leader{border-inline-start-color:var(--mc);background:linear-gradient(180deg,var(--mc2),transparent 60%),var(--card)}
#rsec .card.leader.cf{background:linear-gradient(rgba(47,158,68,.07),rgba(47,158,68,.07)),var(--card)}
#rsec .card.leader .lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.rbar .sp{flex:1}
.rbar .repb{min-height:34px;padding:0 14px;font-size:13px;border-color:var(--mc);color:var(--mc)}
.tb .th{flex-wrap:nowrap !important;align-items:center !important}
.tb .th .tm{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.tb .th .fill{flex:none;white-space:nowrap}
#rsec .tb .th{background:var(--mc2)}
#rsec .arow{border-top-color:var(--mc)}
#actbar .arow{margin:0 0 10px;padding-top:0;border-top:0}

#rsec .need:not(.bad){font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#savOv{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(10,12,18,.62);padding:16px}#savOv.on{display:flex}#savOv>div{background:var(--card,#fff);color:var(--ink,#1c2230);border-radius:16px;padding:22px 20px;max-width:340px;width:100%;text-align:center;font-weight:700;line-height:1.5;box-shadow:0 10px 40px rgba(0,0,0,.35)}#savOv i{display:block;width:38px;height:38px;margin:0 auto 12px;border:4px solid rgba(121,80,242,.25);border-top-color:#7950f2;border-radius:50%;animation:savSpin .8s linear infinite}@keyframes savSpin{to{transform:rotate(360deg)}}

function parseCsv(text) {

function viaJsonp() {

    window[name] = resp => {
      cleanup();

      const rows = resp.table.rows.map(r => r.c.map(c => c == null ? "" : (c.f != null && typeof c.v === "string" && c.v.indexOf("Date(") === 0 ? String(c.f) : c.f != null && typeof c.v !== "string" ? String(c.f).replace(/,/g, "") : String(c.v == null ? "" : c.v))));
      resolve([resp.table.cols.map(c => c.label || "")].concat(rows));
    };
    s.onerror = () => { cleanup(); reject(new Error("load")); };
    s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?gid=" + GID + "&headers=1&tqx=out:json;responseHandler:" + name + "&_=" + Date.now();

// 병사 가치: TG 한 단계가 순금(T11) 차이나 출정 인원 차이보다 크게(6배) — TG 높은 사람이 출정 인원이 적어도 먼저 들어간다.
// 같은 TG 면 T11 이 T10 의 2.5배. (이박사님 2026-10-05: TG 를 가장 높게)
// 참여 시간(시간): TG · 순금이 같을 때 오래 참여하는 사람을 먼저(시간대마다 사람이 덜 바뀌게) — 그다음 전투력
const hoursOf = p => p && p.slots ? SLOTS.reduce((h, x, i) => h + (p.slots[i] ? x[2] - x[1] : 0), 0) : 0;
const hrsId = id => hoursOf(DATA.find(q => q.id === id));
const TGW = (s, t) => s ? Math.pow(6, s[t][0]) * (s[t][1] === 11 ? 5 : 2) : 0;
// 최적 배치: 병과별 필요량(need, 1,000 단위)을 사람들(cap, 1,000 단위)로 채우되 「보낸 병력 × 그 병과 레벨(q)」의 합이 가장 크게.
// 사람 → 병과로 흐르는 최소 비용 흐름을 차례로 늘려 가며 푼다. 레벨 = 그 병과 훈련소 TG 먼저, 같으면 순금(T11 > T10) — 이박사님 2026-10-05.
// 그래서 어떤 병과에 TG 높은 사람이 남아 있는데 낮은 사람을 넣는 일이 없다
function bestFill(need, cap, q) {
  const M = cap.length, S = 0, T = M + 4, N = M + 5, g = Array.from({length: N}, () => []);
  const add = (u, v, c, w) => { g[u].push({v, c, w, r: g[v].length}); g[v].push({v: u, c: 0, w: -w, r: g[u].length - 1}); };
  for (let m = 0; m < M; m++) { add(S, 1 + m, cap[m], 0); for (let t = 0; t < 3; t++) if (need[t] > 0) add(1 + m, M + 1 + t, cap[m], -q[m][t]); }
  for (let t = 0; t < 3; t++) add(M + 1 + t, T, need[t], 0);
  for (;;) {
    const dist = new Array(N).fill(Infinity), pv = new Array(N).fill(-1), pe = new Array(N).fill(-1), inq = new Array(N).fill(false), queue = [S];
    dist[S] = 0;
    while (queue.length) {
      const u = queue.shift();
      inq[u] = false;
      for (let k = 0; k < g[u].length; k++) {
        const e = g[u][k];
        if (e.c > 0 && dist[u] + e.w < dist[e.v]) { dist[e.v] = dist[u] + e.w; pv[e.v] = u; pe[e.v] = k; if (!inq[e.v]) { inq[e.v] = true; queue.push(e.v); } }
      }
    }
    if (dist[T] === Infinity) break;
    let f = Infinity;
    for (let v = T; v !== S; v = pv[v]) f = Math.min(f, g[pv[v]][pe[v]].c);
    for (let v = T; v !== S; v = pv[v]) { const e = g[pv[v]][pe[v]]; e.c -= f; g[v][e.r].c += f; }
  }
  return cap.map((c, m) => { const out = [0, 0, 0]; g[1 + m].forEach(e => { if (e.v > M && e.v <= M + 3) out[e.v - M - 1] = g[e.v][e.r].c; }); return out; });
}

// 한 시간대의 자동 배치. 인원수 × 포메이션 비율 = 병과별 목표. 집결장 본인 병력을 먼저 넣고,
// 집결장 순서대로 하나씩 다 채운 뒤 남은 사람으로 다음 집결장을 채운다. 한 집결 안에서는 가장 모자란 병과에 그 병과 레벨이 가장 높은 사람부터
function alloc(a, i, mode, bx) {
  const box = bx || planBox(a), all = box.leaders || [], lids = new Set(all.map(l => l.id));
  const mem = membersOf(a, box).filter(p => p.slots[i]);
  const march = p => MARCH[p.id] || +box.def || DEF_MARCH;
  const lv = (p, t) => TGW(troops(p), t);
  const fk = fkOf(mode), who = id => DATA.find(q => q.id === id) || {id, name: nameOf(id), gname: "", slots: [], power: 0};
  const fixed = new Set();
  const rallies = all.map(l => ({l, p: mem.find(p => p.id === l.id), fz: l[fk] ? (l[fk][i] || null) : undefined})).filter(x => x.fz !== undefined ? x.fz : x.p).map(x => {
    if (x.fz) {
      const cap = capAt(x.l, i), r = ratioOf(x.l, mode).map(v => Math.max(0, +v || 0)), target = needOf(cap, r);
      const own = [0, 1, 2].map(t => +x.fz.o[t] || 0), members = (x.fz.m || []).map(e => ({p: who(e[0]), send: [+e[1] || 0, +e[2] || 0, +e[3] || 0]}));
      fixed.add(x.l.id); members.forEach(m => fixed.add(m.p.id));
      return {p: x.p || who(x.l.id), cap, r, target, own, frozen: true, need: target.map((v, t) => Math.max(0, v - own[t] - members.reduce((q, m) => q + m.send[t], 0))), members};
    }
    const cap = capAt(x.l, i), r = ratioOf(x.l, mode).map(v => Math.max(0, +v || 0));
    const target = needOf(cap, r), own = ownSplit(Math.min(petOn(x.l, i) && MARCH_ON[x.p.id] ? Math.max(MARCH_ON[x.p.id], march(x.p)) : march(x.p), cap), r, target);
    return {p: x.p, cap, r, target, own, need: target.map((v, t) => Math.max(0, v - own[t])), members: []};
  });
  const outs = new Set(box.out || []);
  const pool = mem.filter(p => !lids.has(p.id) && !fixed.has(p.id) && !outs.has(p.id)).map(p => ({p, rem: march(p), used: false}));
  // 집결장 순서대로, 남은 사람 가운데 「병사 레벨 합이 가장 높아지는」 배치를 구한다(최소 비용 흐름 — 아래 bestFill).
  // 1,000 단위로 끊어 보내고, 끝에 남는 자투리만 한 사람이 채운다
  rallies.forEach(R => {
    if (R.frozen) return;
    const free = pool.filter(m => !m.used);
    if (!free.length) return;
    const rank = free.slice().sort((x, y) => hoursOf(y.p) - hoursOf(x.p) || (y.p.power || 0) - (x.p.power || 0));
    const q = free.map(m => [0, 1, 2].map(t => lv(m.p, t) * 1000 + (free.length - rank.indexOf(m))));
    const units = bestFill(R.need.map(v => Math.floor(v / 1000)), free.map(m => Math.floor(m.rem / 1000)), q);
    const got = free.map((m, k) => ({m, send: units[k].map(u => u * 1000)}));
    got.forEach(g => { [0, 1, 2].forEach(t => { R.need[t] -= g.send[t]; g.m.rem -= g.send[t]; }); });
    // 자투리: 남은 몫을 혼자 채울 수 있는 사람 하나에게 맡긴다. 그 병과 레벨이 가장 높은 사람, 같으면 이미 이 집결에 들어온 사람
    const left = R.need[0] + R.need[1] + R.need[2];
    let last = null;
    if (left > 0) {
      let big = 0;
      [1, 2].forEach(t => { if (R.need[t] > R.need[big]) big = t; });
      const sum = g => g.send[0] + g.send[1] + g.send[2];
      const best = g => lv(g.m.p, 0) + lv(g.m.p, 1) + lv(g.m.p, 2);
      const fit = got.filter(g => g.m.rem >= left);
      last = fit.filter(g => sum(g) > 0).sort((x, y) => lv(y.m.p, big) - lv(x.m.p, big) || (y.m.p.power || 0) - (x.m.p.power || 0))[0] ||
        fit.sort((x, y) => best(x) - best(y) || x.m.rem - y.m.rem)[0] || null;
      if (last) { [0, 1, 2].forEach(t => { last.send[t] += R.need[t]; R.need[t] = 0; }); last.m.rem -= left; }
    }
    const main = g => { let t = 0; [1, 2].forEach(k => { if (g.send[k] > g.send[t]) t = k; }); return t; };
    got.filter(g => g.send[0] + g.send[1] + g.send[2] > 0)
      .sort((x, y) => (x === last) - (y === last) || main(x) - main(y) || lv(y.m.p, main(y)) - lv(x.m.p, main(x)) || (y.send[0] + y.send[1] + y.send[2]) - (x.send[0] + x.send[1] + x.send[2]))
      .forEach(g => { g.m.used = true; R.members.push({p: g.m.p, send: g.send}); });
  });
  return {rallies, rest: pool.filter(m => !m.used).map(m => m.p), joiners: pool.length};
}

function roleHtml(p) {
  const ra = ALLIES.find(b => ((CFG.A[b] || {}).inc || []).indexOf(p.id) >= 0) || p.ally, box = CFG.A[ra];
  const free = '<div class="msg" style="color:var(--ok);font-weight:700">🏹 ' + tx("freeRally") + '</div>';
  if (!box || !(box.leaders || []).length || !(isPub(box, "atk") || isPub(box, "def"))) return '<div class="msg">' + tx("roleNotPub", esc(p.ally)) + '</div>' + free;
  let any = false;
  const kinds = [tx("inf"), tx("cav"), tx("arc")], z = TZ[LANG];
  const amt = v => [0, 1, 2].filter(t => v[t]).map(t => kinds[t] + ' <b>' + fmt(v[t]) + '</b>').join(' · ') + ' = ' + fmt(v[0] + v[1] + v[2]);
  const range = (i0, i1) => '<span class="tm">' + esc(SLOTS[i0][0].slice(0, 5) + '~' + SLOTS[i1][0].slice(6)) + (z ? ' <small>(' + esc(z[0] + ' ' + hm(SLOTS[i0][1], z[1]) + '~' + hm(SLOTS[i1][2], z[1])) + ')</small>' : '') + '</span>';
  let h = '';
  ["atk", "def"].forEach(mode => {
    if (!isPub(box, mode)) return;
    const rows = SLOTS.map((s, i) => {
      if (!p.slots[i]) return {k: "away"};
      const pl = alloc(ra, i, mode, box);
      for (const R of pl.rallies) {
        if (!lConf(box, box.leaders.find(l => l.id === R.p.id), mode)) continue;
        const num = box.leaders.findIndex(l => l.id === R.p.id) + 1;
        if (R.p.id === p.id) { any = true; return {k: "L", num, send: R.own}; }
        const m = R.members.find(x => x.p.id === p.id);
        if (m) { any = true; return {k: "M", num, lead: R.p.gname || R.p.name, send: m.send}; }
      }
      return {k: "idle"};
    });
    h += '<h3>' + tx(mode === "def" ? "bDef" : "bAtk") + '</h3>';
    for (let i = 0; i < rows.length;) {
      let j = i;
      while (j + 1 < rows.length && JSON.stringify(rows[j + 1]) === JSON.stringify(rows[i])) j++;
      const x = rows[i];
      if (x.k === "away" || x.k === "idle") h += '<div class="tb away"><div class="th">' + range(i, j) + '<span class="fill">' + tx(x.k === "away" ? "roleAway" : "roleIdle") + '</span></div></div>';
      else h += '<div class="tb"><div class="th">' + range(i, j) + '<span class="fill" style="color:var(--ok)">' + (x.k === "L" ? '★ ' + tx("roleLeader", x.num) : tx("roleMember", x.num, esc(x.lead))) + '</span></div>' +
        '<div class="ttl"><div class="tr"><span>' + tx("roleSend") + '</span><span class="amt">' + amt(x.send) + '</span></div></div></div>';
      i = j + 1;
    }
  });
  return (any ? '' : free) + h;
}

// 보고서: 지금 보이는 배치(공격 또는 수비)를 글로. 집결장 : 이름 (병력) / 집결원 : 이름 (병력)
function buildReport(a) {
  const box = planBox(a), ls = box.leaders || [], z = TZ[LANG], kinds = [tx("inf"), tx("cav"), tx("arc")];
  const amt = v => [0, 1, 2].filter(t => v[t]).map(t => kinds[t] + " " + fmt(v[t])).join(" · ") || "0";
  const nm = p => p.gname || p.name;
  const plan = SLOTS.map((s, i) => alloc(a, i, RMODE));
  const out = ["[" + a + "] " + tx(RMODE === "def" ? "bDef" : "bAtk")];
  ls.forEach((l, n) => {
    const p = DATA.find(x => x.id === l.id), r = ratioOf(l, RMODE);
    out.push("", "━━ " + tx("nth", n + 1) + " · " + (p ? nm(p) : nameOf(l.id)) + " · " + r.map(v => +v || 0).join(":") + " · " + tx("thRallyCap") + " " + fmt(l.cap) + " ━━");
    const rows = plan.map(pl => pl.rallies.find(q => q.p.id === l.id) || null);
    const sig = x => x ? JSON.stringify([x.own, x.members.map(m => [m.p.id, m.send]), x.need, x.cap]) : "away";
    for (let i = 0; i < rows.length;) {
      let j = i;
      while (j + 1 < rows.length && sig(rows[j + 1]) === sig(rows[i])) j++;
      const x = rows[i], when = "[" + SLOTS[i][0].slice(0, 5) + "~" + SLOTS[j][0].slice(6) + " UTC" + (z ? " / " + z[0] + " " + hm(SLOTS[i][1], z[1]) + "~" + hm(SLOTS[j][2], z[1]) : "") + "]";
      if (!x) out.push(when + " " + tx("leaderAway"));
      else {
        out.push(when, tx("repLeader") + " : " + nm(x.p) + " (" + amt(x.own) + ")");
        x.members.forEach(m => out.push(tx("repMember") + " : " + nm(m.p) + " (" + amt(m.send) + ")"));
        if (x.need[0] + x.need[1] + x.need[2]) out.push("※ " + tx("short", amt(x.need)));
      }
      i = j + 1;
    }
  });
  return out.join("\n");
}

async function load() {

      MARCH_OFF = Object.assign({}, r.march);
      Object.keys(INC20).forEach(id => { if (INC20[id] === r.march[id]) MARCH_OFF[id] = Math.round(r.march[id] / 1.2); });
      // 펫 ON: 예전 ON 입력값에서 펫 버프를 역산한다. ON = 출정 × (1.2 · 1.1 · 1.0) + 펫(고정 목록 0 · 1,500 ~ 15,000) 이 정확히 맞는 짝을 찾고,
      // 안 맞으면(ON 을 손으로 친 경우) 펫은 공란. 펫 0 = 펫을 안 넣은 사람(PET_OF 0)

        const off = r.march[id], on = r.marchOn[id] || 0, base = MARCH[id];

        if (!best) { MARCH_ON[id] = on; return; }
        // 예전 입력값은 건드리지 않는다(이박사님 2026-10-08): 펫 ON 은 본인이 넣은 값 그대로. 역산한 펫은 「펫 미입력」 표시에만 쓴다

      const m = $("aMsg").textContent; box.inc = before; PLAN[a] = JSON.parse(JSON.stringify(box)); renderAdmin(); renderRally(); $("aMsg").textContent = m || tx("aFail"); $("aMsg").style.color = "var(--warn)";
    });

  const ab = e.target.closest("button.outadd");
  if (ab) {
    const a = $("rAlly").value || ALLIES[0], box = DRAFT && DRAFT.A[a], id = $("outPick").value;

  }

    if (!box || !can(a) || SAVING) return;
    if (!($("aPass") && $("aPass").value.trim())) { $("aMsg").textContent = tx("passNeed"); $("aMsg").style.color = "var(--warn)"; if ($("aPass")) { $("aPass").focus(); $("aPass").scrollIntoView({block: "center"}); } return; }
    const before = (box.out || []).slice();

      const m = $("aMsg").textContent; box.out = before; PLAN[a] = JSON.parse(JSON.stringify(box)); renderAdmin(); renderRally(); $("aMsg").textContent = m || tx("aFail"); $("aMsg").style.color = "var(--warn)";

  if (sb) { SWAP = {lid: sb.dataset.l, out: sb.dataset.out, i0: +sb.dataset.i0, i1: +sb.dataset.i1}; renderRally(); return; }
  if (e.target.closest("button.swgo")) {
    const a = $("rAlly").value || ALLIES[0], box = DRAFT && DRAFT.A[a], fk = fkOf(RMODE), y = ($("swSel") || {}).value;
    if (!box || !can(a) || SAVING || !SWAP || !y) return;
    if (!needPass()) return;
    const W = JSON.parse(JSON.stringify(box)), k = W.leaders.findIndex(l => l.id === SWAP.lid), X = SWAP.out, slots = [];
    const tot = v => v[0] + v[1] + v[2], nmOf = id => { const q = DATA.find(x => x.id === id); return q ? (q.gname || q.name) : "?"; };
    for (let i = SWAP.i0; i <= SWAP.i1; i++) {
      const Z = W.leaders[k][fk] && W.leaders[k][fk][i], ex = Z && Z.m.find(e => e[0] === X);
      if (!ex) continue;
      const j = W.leaders.findIndex((L, n) => n > k && L[fk] && L[fk][i] && L[fk][i].m.some(e => e[0] === y));
      if (j < 0) continue;
      const sx = ex.slice(1, 4), Y = W.leaders[j][fk][i], ey = Y.m.find(e => e[0] === y), sy = ey.slice(1, 4);
      if (mOf(W, y) < tot(sx)) { alert(tx("swapWarn", nmOf(y), fmt(mOf(W, y)), fmt(tot(sx)))); return; }
      let left = mOf(W, X); const gx = [0, 0, 0];
      [0, 1, 2].sort((p, q) => sy[q] - sy[p]).forEach(t => { const v = Math.min(sy[t], left); gx[t] = v; left -= v; });

      const lack = [0, 1, 2].map(t => sy[t] - gx[t]);
      if (tot(lack) > 0) mv.push({id: null, from: null, to: j, send: lack});
      slots.push({i, moves: mv});
    }
    if (!slots.length) { alert(tx("swapNone")); return; }

      Z.m = Z.m.filter(e => e[0] !== out);
      slots.push({i, moves: pushChain(a, RMODE, W, i, k, ex.slice(1, 4))});
    }
    if (!slots.length) return;
    const nmOf = id => { const q = DATA.find(x => x.id === id); return q ? (q.gname || q.name) : "?"; };
    const note = () => moveNotice(a, tx("ntHead", a, nmOf(out)).replace(/^📢 \[[^\]]*\] /, ""), k, W, slots);
    if (!confirm(tx("subAsk", tx("nth", k + 1), nmOf(out), note()))) return;
    commitW(a, W, note, "subDone");
    return;
  }
  if (pickTab(e)) return;
  if (e.target.closest("button.repb")) { openReport(); return; }
});

$("admin").addEventListener("input", e => {

const adminClick = e => {

    const before = box.pub || "";

    DIRTY[a] = true;
    saveConfig().then(ok => {
      if (ok) { msg.style.color = "var(--ok)"; msg.innerHTML = '<b>' + esc(tx("pubDone", a, tx(RMODE === "def" ? "mDef" : "mAtk"))) + '</b>'; return; }
      const m = msg.textContent; box.pub = before; renderAdmin(); renderRally(); msg.textContent = m || tx("aFail"); msg.style.color = "var(--warn)";
    });
    return;
  }

    const a = $("rAlly").value || ALLIES[0], pv = (CFG.P || {})[a];

    const before = JSON.stringify(DRAFT.A[a] || blank());
    DRAFT.A[a] = JSON.parse(JSON.stringify(pv)); SELK[a] = 0; DIRTY[a] = true; PLAN[a] = JSON.parse(JSON.stringify(pv));
    renderAdmin(); render();
    saveConfig().then(ok => {
      if (ok) { $("aMsg").style.color = "var(--ok)"; $("aMsg").textContent = tx("undoDone"); return; }
      const m = $("aMsg").textContent; DRAFT.A[a] = JSON.parse(before); PLAN[a] = JSON.parse(before); renderAdmin(); render(); $("aMsg").textContent = m || tx("aFail"); $("aMsg").style.color = "var(--warn)";
    });
    return;
  }
  if (e.target.id === "aAdd") {
    const id = $("aPick").value, a = $("rAlly").value || ALLIES[0];
    if (!id || !DRAFT) return;
    const box = DRAFT.A[a] || (DRAFT.A[a] = blank());

    SELK[a] = Math.max(0, box.leaders.findIndex(l => l.id === id));
    DIRTY[a] = true;
    renderAdmin(); render();
    return;
  }
  const up = e.target.closest("button.up");

    const ls = leadersOf($("rAlly").value || ALLIES[0]), k = +up.getAttribute("data-up");

    return;
  }
  const d = e.target.closest("button.del");
  if (!d) return;
  DIRTY[$("rAlly").value || ALLIES[0]] = true;
  leadersOf($("rAlly").value || ALLIES[0]).splice(+d.dataset.k, 1);
  renderAdmin();
  render();
};
