<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>700서버 KvK 참여 현황</title>
<style>
:root{--bg:#e9edf7;--card:#fff;--ink:#1c2230;--sub:#667085;--line:#e3e6ec;--accent:#3b5bdb;--ok:#2f9e44;--warn:#e8590c;--bar:#dfe4f3}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--ink:#e8ebf2;--sub:#98a2b3;--line:#2b3242;--accent:#7b93ff;--ok:#51cf66;--warn:#ff922b;--bar:#2a3145}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--sub);font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.section{margin-bottom:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:13px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.dot{color:var(--ok);font-weight:700}
.no{color:var(--line)}
tr.bad td{background:rgba(224,49,49,.10);color:#c92a2a;text-decoration:line-through;text-decoration-color:#e03131;text-decoration-thickness:2px}
tr.bad td:first-child{box-shadow:inset 4px 0 0 #e03131}
#badBox{border:2px solid #e03131}
#badBox>h2{border-inline-start-color:#e03131;color:#e03131}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.62);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
.mbox{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:680px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.mbox.wide{max-width:820px;padding:14px}
#popFrame{display:block;width:100%;height:calc(100vh - 130px);min-height:420px;border:0;border-radius:10px;background:#fff}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{margin:0;font-size:19px;color:#e8590c}
.warmap{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:16px auto;border-radius:50%;border:2px dashed var(--line);background:radial-gradient(circle,var(--bar) 0,var(--bar) 60%,transparent 61%)}
.warmap .castle{position:absolute;left:50%;top:50%;width:58%;height:58%;transform:translate(-50%,-50%);object-fit:contain;border-radius:14px}
.warmap .ph{display:none;align-items:center;justify-content:center;font-size:96px}
.warmap .castle[hidden]+.ph{display:flex}
.hr{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.hn{width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hr.on .hn{background:#f59f00;border-color:#f59f00;color:#fff}
.hr .tag{font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.warset select{padding:5px 8px}
.lcard{border:1px solid var(--line);border-inline-start:4px solid #f59f00;border-radius:10px;padding:10px;margin-top:10px;background:var(--card)}
.lhead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.lhead .sp{flex:1}
.lrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:13px}
.lrow>b{min-width:124px}
.need.bad{color:#fff;background:var(--warn);border-radius:8px;padding:6px 10px}
.need{flex:1 1 100%;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
details.tt{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--card);overflow:hidden}
details.tt>summary{cursor:pointer;padding:9px 12px;background:var(--bar);font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
details.tt>summary small{font-weight:400;color:var(--sub);font-size:12px}
details.tt>summary .fill{margin-inline-start:auto;font-size:12px;font-weight:700}
details.tt.away>summary{font-weight:400;color:var(--sub)}
.tb{border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden;background:var(--card)}
.tb .th{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:6px 10px;background:var(--bar);font-weight:700;font-size:13px}
.tb .th small{font-weight:400;color:var(--sub);font-size:11px}
.tb .th .fill{margin-inline-start:auto;font-size:12px}
.tb.away{border-style:dashed}
.tb.away .th{background:none;font-weight:400;color:var(--sub)}
.ttl .tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding:4px 10px;border-top:1px solid var(--line);font-size:12.5px}
.ttl .amt{margin-inline-start:auto;text-align:end;font-variant-numeric:tabular-nums}
.ttl .amt b{margin-inline-start:6px}
.ttl .tr.own{background:rgba(245,159,0,.10)}
.ttl .tr.sum{background:var(--bar);font-weight:700}
.ttl .tr small{color:var(--accent);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:1 1 100%;min-width:0}
.fgrid label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;min-width:0;white-space:nowrap}
.fgrid input{flex:1 1 0;min-width:0;width:0 !important;padding:0 6px}
.lrow.form>b{flex:1 1 100%}
.adminbox label.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.ltabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ltab{min-height:36px;padding:0 12px;border-radius:99px;font-size:13px}
.ltab.on{background:#f59f00;border-color:#f59f00;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.stats>div{background:var(--bar);border-radius:10px;padding:8px;min-width:0}
.stats small{display:block;color:var(--sub);font-size:11px;line-height:1.2;min-height:1.2em}
.stats b{font-size:15px;font-variant-numeric:tabular-nums}
.stats input{width:100% !important;min-width:0;min-height:30px !important;padding:0 6px !important;font-weight:700;font-size:15px}
.stats .hot{background:rgba(245,159,0,.18)}
#repText{display:block;width:100%;height:58vh;min-height:240px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bar);color:var(--ink);font:13px/1.55 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;white-space:pre;overflow:auto;resize:vertical}
.arow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.arow label{display:flex;align-items:center;gap:6px;margin:0}
#aReset{color:var(--warn);border-color:var(--warn)}
.modebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.tw{position:absolute;transform:translate(-50%,-50%);z-index:3;min-width:30px;height:26px;padding:0 7px;border-radius:99px;border:2px dashed #ff6b6b;background:rgba(224,49,49,.28);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;white-space:nowrap}
.tw.on{border-style:solid;background:rgba(224,49,49,.85)}
.tw.hot{outline:3px solid #ffd43b}
.hr{z-index:4}
.hr .tag.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.warset input.memo{width:200px;text-align:start}
.fbox{background:var(--bar);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fgrp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.fgrp b{min-width:36px}
.fgrp select{padding:5px 8px}
.chip{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;color:var(--sub)}
.chip.on{color:#fff}
.chip.on.t10{background:#f59f00;border-color:#f59f00}
.chip.on.t11{background:#e03131;border-color:#e03131}
.pager{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pager button{padding:4px 11px;font-size:14px}
.pager button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}
.badtag{display:inline-block;text-decoration:none;background:#e03131;color:#fff;border-radius:4px;padding:0 6px;font-size:11px;font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--bar);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.msg{padding:14px;border-radius:10px;background:var(--bar);margin-bottom:16px}
.msg.err{border:1px solid var(--warn)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.star{border:none;background:none;padding:0 4px;font-size:18px;color:var(--sub)}
.star.on{color:#f59f00}
.adminbox{border:2px dashed #f59f00;border-radius:12px;padding:14px;margin-bottom:14px}
.adminbox input{width:96px;padding:5px 8px;text-align:right}
.adminbox input.pc{width:58px}
.adminbox input.name{width:130px;text-align:start}
.adminbox button.del{padding:3px 10px;font-size:13px}
table.plan th,table.plan td{padding:6px 8px;font-size:13px}
table.plan tr.own td{background:rgba(245,159,0,.10)}
table.plan tr.sum td{font-weight:700;background:var(--bar)}
.short{color:var(--warn);font-size:12px}
td.march{line-height:1.25}
td.march small{color:var(--sub);font-size:11px}
.hero{background:linear-gradient(120deg,#1b2a80 0%,#5f3dc4 55%,#d6336c 100%);color:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 6px 20px rgba(60,40,160,.25)}
.hero h1{font-size:24px}
.hero .sub{color:rgba(255,255,255,.85)}
.hero button{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}
.hero button.primary{background:#ffd43b;border-color:#ffd43b;color:#1c2230;font-weight:700}
.card{box-shadow:0 2px 8px rgba(30,40,90,.06)}
.card.total{background:linear-gradient(135deg,#3b5bdb,#7950f2);border:none;color:#fff}
.card.total .sub{color:rgba(255,255,255,.85)}
.card.total .bar{background:rgba(255,255,255,.3)}
.card.total .bar>i{background:#ffd43b}
.section>h2{border-inline-start:5px solid var(--accent);padding-inline-start:10px}
h2.slot{background:var(--bar);border-inline-start:5px solid #f59f00;border-radius:6px;padding:6px 10px}
th{background:var(--bar)}
th small{font-weight:400}
tr:hover td{background:rgba(121,80,242,.06)}
.dot.full{color:#f59f00}
.tier{display:inline-block;min-width:34px;padding:1px 6px;border-radius:6px;font-weight:700;font-size:13px;background:var(--bar)}
.tier.t11{background:#e03131;color:#fff}
.tier.t10{background:#f59f00;color:#fff}
.tier.t9{background:#2f9e44;color:#fff}
.troopline{font-size:13px;margin:4px 0}
.card.leader{border-inline-start:5px solid #f59f00;background:linear-gradient(180deg,rgba(245,159,0,.10),transparent 60%),var(--card)}
.lname{font-weight:700;font-size:16px;color:#e8590c}
.names small{color:var(--accent);font-weight:700}
.msg{border-inline-start:5px solid var(--accent)}
.langs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.langs button{font-size:14px;padding:6px 12px;border-radius:99px}
.langs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.names span{background:var(--bar);border-radius:6px;padding:2px 8px;font-size:13px}
.names span.noid{background:none;border:1px dashed var(--sub);color:var(--sub)}
button{white-space:nowrap}
h1,h2,.sub,label,th,td,.msg{word-break:keep-all}
.mhead h2{flex:1;min-width:0;line-height:1.3}
.xbtn{flex:none;width:36px;height:36px;padding:0;border-radius:50%;font-size:16px;line-height:1}
.top .acts{display:flex;flex-wrap:wrap;gap:8px}
.top .acts a{display:block;text-decoration:none}
@media (max-width:600px){
  .wrap{padding:12px 10px 50px}
  .langs{flex-wrap:nowrap;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
  .langs button{flex:none;padding:5px 11px;font-size:13px}
  .hero{padding:16px 14px}
  .hero h1{font-size:20px}
  .top .acts{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .top .acts button{width:100%;padding:9px 6px}
  .grid{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .card{padding:12px}
  .card.total{grid-column:1/-1}
  .big{font-size:24px}
  .section{margin-bottom:12px}
  th,td{padding:7px 8px;font-size:13px}
  .fbox{padding:10px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .frow>select,.frow>input,.frow>button{width:100% !important;min-width:0}
  #fTroops{grid-template-columns:1fr}
  .fgrp{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 8px}
  .fgrp select{grid-column:2/-1;min-width:0}
  .fgrp .sub{grid-column:1/3}
  .modal{padding:10px 6px}
  .mbox,.mbox.wide{padding:14px 12px}
  .mhead h2{font-size:16px}
  .hn{width:22px;height:22px;font-size:11px}
  .hr .tag{font-size:11px;padding:0 6px}
  #popFrame{height:calc(100vh - 96px)}
  .adminbox{padding:10px}
  .adminbox input{width:84px}
  .adminbox .frow{grid-template-columns:1fr auto}
  .adminbox .frow>b{grid-column:1/-1}
  .modebar button{flex:1}
  .arow label{flex:1 1 100%}
  .arow label input{flex:1;width:auto !important;min-width:0}
  .arow button{flex:1}
  .adminbox input.name,.warset input.memo{width:130px}
  .pager button{padding:4px 9px}
}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.topbar .langs{margin-bottom:0}
#menuBtn{display:flex;align-items:center;gap:8px;font-weight:700}
#menuBtn .ico{font-size:17px;line-height:1}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:250px;max-width:82vw;background:var(--card);padding:16px 12px;box-shadow:6px 0 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;font-size:17px;padding-inline-start:6px}
.drawer button.item{width:100%;text-align:start;min-height:46px;font-size:15px;border-color:transparent;background:none}
.drawer button.item.on{background:var(--accent);color:#fff}
.drawer button.item:hover{border-color:var(--line)}
/* 시간대별 막대그래프 */
.chart{display:flex;align-items:flex-end;gap:8px;margin-top:4px}
.col{flex:1;min-width:0;position:relative;outline:none}
.col .plot{height:178px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--line)}
.col .val{font-weight:700;font-size:14px;margin-bottom:4px}
.col .stack{width:70%;max-width:46px;display:flex;flex-direction:column-reverse;gap:2px}
.col .stack i{display:block}
.col .stack i:last-child{border-radius:4px 4px 0 0}
.col:hover .stack,.col:focus .stack{filter:brightness(1.12)}
.col .xl{margin-top:6px;text-align:center;line-height:1.25;font-size:12px;font-weight:700}
.col .xl small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.col .tip{display:none;position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:5;background:var(--ink);color:var(--card);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none}
.col:first-child .tip{left:0;transform:none}
.col:last-child .tip{left:auto;right:0;transform:none}
.col:hover .tip,.col:focus .tip{display:block}
.tip i,.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
details.tbl{margin-top:12px}
details.tbl summary{cursor:pointer;color:var(--sub);font-size:13px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:460px;margin-bottom:12px;padding:4px;background:var(--bar);border-radius:12px}
.seg button{min-height:32px;padding:0 2px;border:none;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff}
/* 연맹 고르기는 노란 칸으로 눈에 띄게, 병과 필터는 색 딱지로 구분: 보병 파랑 · 기병 주황 · 궁병 초록 */
#fAlly{border:2px solid #f08c00;background:#ffd43b;color:#1c2230;font-weight:800}
#fAlly option{background:var(--card);color:var(--ink);font-weight:400}
.fgrp.k0{border:2px solid #1c7ed6;background:rgba(28,126,214,.20)}
.fgrp.k1{border:2px solid #e8590c;background:rgba(232,89,12,.20)}
.fgrp.k2{border:2px solid #2f9e44;background:rgba(47,158,68,.20)}
.fgrp>b{color:#fff !important;border-radius:8px;padding:4px 10px;min-width:0;text-align:center}
.fgrp.k0>b{background:#1c7ed6}
.fgrp.k1>b{background:#e8590c}
.fgrp.k2>b{background:#2f9e44}
.fgrp.k0 select{border-color:#1c7ed6}
.fgrp.k1 select{border-color:#e8590c}
.fgrp.k2 select{border-color:#2f9e44}
#fName{border:2px solid #f59f00;background:rgba(255,212,59,.18);font-weight:600}
#fName::placeholder{color:#e8590c;opacity:1}
/* 단추 · 입력칸 크기 통일 */
button,select,input{min-height:40px;border-radius:10px;padding:0 14px;font-size:14px}
button{font-weight:600}
select,input{padding:0 10px}
.top .acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.top .acts button{width:100%;white-space:normal;line-height:1.2}
.star{min-height:0;padding:0 4px}
.chip{min-height:30px;padding:0 13px}
.pager button{min-height:34px;min-width:34px;padding:0 10px}
.fgrp select,.warset select{min-height:34px;padding:0 8px}
.adminbox input{min-height:34px;padding:0 8px}
.adminbox button.del{min-height:30px;padding:0 10px}
.xbtn{min-height:36px;padding:0}
/* 언어 고르기: 한 줄 다섯 칸 */
.langs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:460px;margin-inline-start:auto;margin-bottom:12px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:visible}
.langs button{min-height:32px;padding:0 2px;border:none;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--sub)}
.langs button.on{background:var(--accent);color:#fff}
@media (max-width:600px){
  .topbar{margin-bottom:10px}
  .chart{gap:4px}
  .col .val{font-size:13px}
  .col .xl{font-size:11px}
  .col .xl small{font-size:10px}
  .seg{max-width:none}
  .topbar .langs{flex:1 1 100%;max-width:none;order:2}
  .langs{max-width:none;padding:4px}
  .langs button{padding:0 2px;font-size:12px}

    if (!a || !b || !rowOk(String(row[ci.admin] || "").trim(), a)) return;
    if (a === "MAP") {
      if (map && b <= map.batch) return;
      try {
        const P = JSON.parse(String(row[ci.lname] || ""));
        if (P && typeof P === "object") map = {batch: b, P, by: String(row[ci.by] || "").trim(), at: String(row[ci.at] || "").trim()};
      } catch (e) {}
      return;
    }
    if (!last[a] || b > last[a].batch) last[a] = {batch: b, def: num(row[ci.def]) || 100000, leaders: [], by: String(row[ci.by] || "").trim(), at: String(row[ci.at] || "").trim()};
    if (b !== last[a].batch) return;
    const id = String(row[ci.lid] || "").trim();
    if (/^[0-9]{5,12}$/.test(id) && !last[a].leaders.some(l => l.id === id)) {

    }

}

// 병사 정보 설문 탭. 병사 줄: 같은 ID 는 마지막 줄만, 훈련소 레벨이 TG 보다 높은 줄은 버린다. 설정 줄: 관리자 값이 맞는 마지막 줄
async function loadSelf() {
  const r = await fetch("https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?gid=" + TROOP_GID + "&headers=1&tqx=out:csv&_=" + Date.now());
  const rows = parseCsv(await r.text());
  const h = rows[0] || [], col = n => h.findIndex(x => String(x).trim() === n);
  const ci = {id: col("game_id"), tg: col("tg"), m: col("march number"), mo: col("march_on number"), ra: col("rally number"), rao: col("rally_on number"), cfg: col("config number"), c: ["inf_camp number", "cav_camp number", "arc_camp number"].map(col), t: ["inf_tier number", "cav_tier number", "arc_tier number"].map(col)};
  const out = {}, march = {}, marchOn = {}, rally = {}, rallyOn = {};
  let cfg = null;
  rows.slice(1).forEach(row => {
    const cj = ci.cfg >= 0 ? String(row[ci.cfg] || "").trim() : "";
    if (cj) {
      try { const c = JSON.parse(cj); if (c && ADMIN_H && c.k === ADMIN_H && c.A) cfg = c; } catch (e) {}
      return;
    }
    const id = String(row[ci.id] || "").trim(), tg = parseInt(row[ci.tg], 10);
    if (!/^[0-9]{5,12}$/.test(id) || !(tg >= 0 && tg <= 8)) return;
    const s = [0, 1, 2].map(i => [parseInt(row[ci.c[i]], 10), parseInt(row[ci.t[i]], 10)]);
    if (s.some(x => !(x[0] >= 0 && x[0] <= tg) || (x[1] !== 10 && x[1] !== 11))) return;
    out[id] = s;
    const m = ci.m >= 0 ? parseInt(row[ci.m], 10) : NaN;
    if (m >= 1000 && m <= 3000000) march[id] = m; else delete march[id];
    const mo = ci.mo >= 0 ? parseInt(row[ci.mo], 10) : NaN;
    if (mo >= 1000 && mo <= 3000000) marchOn[id] = mo; else delete marchOn[id];
    const ra = ci.ra >= 0 ? parseInt(row[ci.ra], 10) : NaN, rao = ci.rao >= 0 ? parseInt(row[ci.rao], 10) : NaN;
    if (ra >= 1000 && ra <= 9000000) rally[id] = ra; else delete rally[id];
    if (rao >= 1000 && rao <= 9000000) rallyOn[id] = rao; else delete rallyOn[id];
  });
  return {self: out, march, marchOn, rally, rallyOn, cfg};
}

function tcLabel(v) {
  if (v == null) return "";
  if (v <= 30) return "TC" + v;
  const tg = Math.floor((v - 30) / 5), sub = (v - 30) % 5;
  if (!tg) return "TC30-" + sub;
  return "TG" + tg + (sub ? "-" + sub : "");
}
function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function viaJsonp() {
  return new Promise((resolve, reject) => {
    const name = "__gviz" + Date.now();
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 9000);
    const s = document.createElement("script");
    function cleanup() { clearTimeout(timer); delete window[name]; s.remove(); }
    window[name] = resp => {
      cleanup();
      if (!resp || resp.status === "error") return reject(new Error("gviz"));
      const rows = resp.table.rows.map(r => r.c.map(c => c == null ? "" : (c.f != null && typeof c.v !== "string" ? String(c.f).replace(/,/g, "") : String(c.v == null ? "" : c.v))));
      resolve([resp.table.cols.map(c => c.label || "")].concat(rows));
    };
    s.onerror = () => { cleanup(); reject(new Error("load")); };
    s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?gid=" + GID + "&headers=1&tqx=out:json;responseHandler:" + name + "&_=" + Date.now();
    document.head.appendChild(s);
  });
}

async function fetchRows() {

    const t = await r.text();
    if (!r.ok || t.trim().startsWith("<")) throw new Error("csv");
    return parseCsv(t);
  } catch (e) {
    return viaJsonp();
  }
}

function build(rows) {
  const byId = new Map();
  BAD_ID = 0; BAD = [];
  const head = rows[0] || [];
  const langCol = head.findIndex(h => String(h).indexOf("Language") >= 0);
  rows.slice(1).forEach(row => {
    if (!row) return;
    const lang = langCol >= 0 ? String(row[langCol] || "").trim().split(" ")[0] : "";
    const f = row.filter((v, i) => i > 0 && i !== langCol && String(v || "").trim() !== "");
    if (f.length < 3) return;
    const r = f.length === 3 ? [row[0], f[0], "", f[1], f[2]] : [row[0], f[0], f[1], f[2], f[3]];
    const ally = String(r[1] || "").trim().split(" ")[0];
    const id = /^[0-9]{7,12}$/.test(String(r[2] || "").trim()) ? String(r[2]).trim() : "";
    if (!ally) return;
    const ans = String(r[4] || "");
    const full = ans.indexOf("FULL") >= 0;
    const picks = ans.split(", ").map(x => x.trim());
    const slots = SLOTS.map(s => full || picks.some(x => x.indexOf(s[0]) === 0));
    if (!id) {
      BAD_ID++;
      BAD.push({bad: true, key: "bad" + BAD_ID, lang, time: r[0], ally, id: String(r[2] || "").trim(), name: String(r[3] || "").trim(), full, slots, gname: "", gally: "", matched: false, power: null, tc: "", mystic: null});
      return;
    }
    byId.set(id, {key: id, lang, time: r[0], ally, id: String(r[2] || "").trim(), name: String(r[3] || "").trim(), full, slots});
  });
  const list = [...byId.values()];
  list.forEach(p => {
    const info = LOOKUP[p.id];
    if (info) {
      p.power = info.p; p.tc = tcLabel(info.tc); p.gname = info.n; p.gally = info.a || ""; p.matched = true; p.mystic = info.m || null;
      return;
    }
    let m = null;
    ALLIES.some(a => (m = ROSTER[a].members.find(x => norm(x[0]) === norm(p.name))));
    p.power = m ? m[1] : null; p.tc = m ? m[2] : ""; p.gname = ""; p.gally = ""; p.matched = false; p.mystic = null;
  });
  list.sort((a, b) => (b.mystic || 0) - (a.mystic || 0) || (b.power || 0) - (a.power || 0));
  return list;
}

// 한 시간대의 자동 배치. 인원수 × 포메이션 비율 = 병과별 목표. 집결장 본인 병력을 먼저 넣고,
// 집결장 순서대로 하나씩 다 채운 뒤 남은 사람으로 다음 집결장을 채운다. 한 집결 안에서는 가장 모자란 병과에 그 병과 레벨이 가장 높은 사람부터
function alloc(a, i, mode) {
  const mem = DATA.filter(p => p.ally === a && p.slots[i]);
  const box = planBox(a), all = box.leaders || [], lids = new Set(all.map(l => l.id));
  const march = p => MARCH[p.id] || +box.def || 100000;
  const lv = (p, t) => { const s = troops(p); return s ? s[t][1] * 100 + s[t][0] : 0; };
  const rallies = all.map(l => ({l, p: mem.find(p => p.id === l.id)})).filter(x => x.p).map(x => {
    const cap = Math.max(0, +x.l.cap || 0), r = ratioOf(x.l, mode).map(v => Math.max(0, +v || 0));
    const target = needOf(cap, r), own = needOf(Math.min(march(x.p), cap), r);
    return {p: x.p, cap, r, target, own, need: target.map((v, t) => Math.max(0, v - own[t])), members: []};
  });
  const pool = mem.filter(p => !lids.has(p.id)).map(p => ({p, rem: march(p), used: false}));
  rallies.forEach(R => {
    for (;;) {
      const free = pool.filter(m => !m.used);
      if (!free.length || R.need[0] + R.need[1] + R.need[2] <= 0) break;
      let t = 0;
      [1, 2].forEach(k => { if (R.need[k] > R.need[t]) t = k; });
      free.sort((x, y) => lv(y.p, t) - lv(x.p, t) || (y.p.power || 0) - (x.p.power || 0));
      const m = free[0], send = [0, 0, 0];
      m.used = true;
      [t].concat([0, 1, 2].filter(k => k !== t).sort((x, y) => lv(m.p, y) - lv(m.p, x))).forEach(k => {
        const g = Math.min(m.rem, R.need[k]);
        if (g > 0) { send[k] = g; m.rem -= g; R.need[k] -= g; }
      });
      R.members.push({p: m.p, send});
    }
  });
  return {rallies, rest: pool.filter(m => !m.used).map(m => m.p), joiners: pool.length};
}

});
$("warBody").addEventListener("pointermove", e => {
  if (!DRAG) return;
  const pt = dragPoint(e), ln = $("dragLine");
  if (Math.hypot(pt[0] - DRAG.start[0], pt[1] - DRAG.start[1]) > 3) DRAG.moved = true;
  if (!ln || !DRAG.moved) return;
  ln.setAttribute("x1", DRAG.from[0]); ln.setAttribute("y1", DRAG.from[1]); ln.setAttribute("x2", pt[0]); ln.setAttribute("y2", pt[1]);
  ln.style.display = "";
  const hot = nearTower(pt);
  [...document.querySelectorAll("#warMap .tw")].forEach(t => t.classList.toggle("hot", t.getAttribute("data-t") === hot));
});
["pointerup", "pointercancel"].forEach(ev => $("warBody").addEventListener(ev, e => {
  if (!DRAG) return;
  const d = DRAG;
  DRAG = null;
  if (d.moved && ev === "pointerup") { MAPD[d.a].t = nearTower(dragPoint(e)); MAP_DIRTY = true; }
  renderWar();
}));

async function saveMap() {
  const msg = $("wMsg"), by = ($("wBy").value || "").trim(), stamp = Date.now(), at = new Date().toLocaleString("sv-SE").slice(0, 16);
  if (!by) { msg.textContent = tx("aNeedName"); $("wBy").focus(); return; }
  msg.textContent = tx("aSaving");
  const body = new URLSearchParams();
  body.append(CF.batch, String(stamp)); body.append(CF.at, at); body.append(CF.by, by); body.append(CF.ally, "MAP");
  body.append(CF.lname, JSON.stringify(mapClean(MAPD))); body.append(CF.admin, ME.h);
  try { await fetch(CFG_POST, {method: "POST", mode: "no-cors", body}); } catch (e) {}
  for (let n = 0; n < 8; n++) {
    await new Promise(r => setTimeout(r, 2500));
    try {
      const c = await loadConfig();
      if (c.map && c.map.batch === stamp) {
        CFG = c; MAP_DIRTY = false; MAPD = mapClean(mapSaved());
        renderWar();
        $("wMsg").textContent = tx("warDone");
        return;
      }
    } catch (e) {}
  }
  msg.textContent = tx("aFail");
}

// 지금 고른 연맹의 설정을 드라이브 시트에 한 줄씩(집결장마다) 쌓는다
async function saveConfig() {
  const msg = $("aMsg"), a = $("rAlly").value || ALLIES[0], box = DRAFT.A[a] || blank();
  if (!can(a)) return;
  const by = ($("aBy").value || "").trim(), stamp = Date.now(), at = new Date().toLocaleString("sv-SE").slice(0, 16);
  if (!by) { msg.textContent = tx("aNeedName"); $("aBy").focus(); return; }
  if (!boxOk(box)) { msg.textContent = tx("sumBlock"); return; }
  const rows = box.leaders.length ? box.leaders : [null];
  msg.textContent = tx("aSaving");
  for (const l of rows) {
    const body = new URLSearchParams();
    body.append(CF.batch, String(stamp)); body.append(CF.at, at); body.append(CF.by, by); body.append(CF.ally, a);
    body.append(CF.def, String(+box.def || 100000)); body.append(CF.admin, ME.h);
    if (l) {
      const p = DATA.find(x => x.id === l.id);
      body.append(CF.lid, l.id); body.append(CF.lname, (p ? (p.gname || p.name) : "") + " [D:" + ratioOf(l, "def").map(v => +v || 0).join("/") + "]");
      body.append(CF.cap, String(+l.cap || 0));
      [0, 1, 2].forEach(t => body.append(CF.r[t], String(+l.r[t] || 0)));
    }
    try { await fetch(CFG_POST, {method: "POST", mode: "no-cors", body}); } catch (e) {}
  }
  for (let n = 0; n < 8; n++) {
    await new Promise(r => setTimeout(r, 2500));
    try {
      const c = await loadConfig(), got = c.A[a];
      if (got && got.batch === stamp && got.leaders.length === box.leaders.length) {
        CFG = c; DIRTY[a] = false; delete PLAN[a]; syncDraft();
        renderAdmin(); render();
        $("aMsg").textContent = tx("aSaved");
        return;
      }
    } catch (e) {}
  }
  msg.textContent = tx("aFail");
}

async function initAdmin() {
  const q = new URLSearchParams(location.search);
  let t = q.get("admin") || "";
  try { if (!t) t = localStorage.getItem("k700admin") || ""; } catch (e) {}
  if (!t || !ADMIN_LIST.length || !window.crypto || !crypto.subtle) return;
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  const hx = [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
  ME = ADMIN_LIST.find(x => x.h === hx) || null;
  if (!ME) return;
  IS_ADMIN = true;
  try { localStorage.setItem("k700admin", t); } catch (e) {}
  if (q.get("admin")) history.replaceState(null, "", location.pathname);
}

function renderStamp() {
  $("stamp").style.display = "";
  if (LOAD_ERR) {
    $("stamp").textContent = tx("loadFail");
    $("msg").innerHTML = '<div class="msg err">' + esc(tx("loadFailMsg")) + '</div>';
    return;
  }
  if (!LOADED_AT) { $("stamp").textContent = tx("loading"); return; }
  // 평소에는 제목 아래 글을 비운다(숫자는 아래 카드에 있다). 풍선 도움말로만 남긴다
  $("stamp").textContent = ""; $("stamp").style.display = "none";
  $("tTitle").title = tx("stamp", DATA.length, LOADED_AT.toLocaleString(LOCALE[LANG])) + (BAD_ID ? tx("stampBad", BAD_ID) : "") + tx("stampTail", typeof PLAYERS_AT === "undefined" ? "-" : PLAYERS_AT);
}

async function load() {
  if (!LOADED_AT) $("stamp").textContent = tx("loading");
  try {
    const first = !DATA.length;
    try {
      const r = await loadSelf();
      SELF = r.self; MARCH = r.march; MARCH_ON = r.marchOn; RALLY = r.rally; RALLY_ON = r.rallyOn;
    } catch (e) {}
    try { CFG = await loadConfig(); } catch (e) {}
    const firstDraft = IS_ADMIN && !DRAFT;
    if (IS_ADMIN) syncDraft();
    if (IS_ADMIN && !MAP_DIRTY) MAPD = mapClean(mapSaved());
    if ($("war").style.display !== "none" && !DRAG && !$("warBody").contains(document.activeElement)) renderWar();
    DATA = build(await fetchRows());
    if (first) { const a = ALLIES.find(x => DATA.some(p => p.ally === x)); if (a) $("rAlly").value = a; }
    $("msg").innerHTML = "";
    LOADED_AT = new Date(); LOAD_ERR = false;
    renderStamp();
    render();
    const cur = $("rAlly").value || ALLIES[0];
    if (firstDraft || first || (IS_ADMIN && !DIRTY[cur] && !$("admin").contains(document.activeElement))) renderAdmin();
  } catch (e) {
    LOAD_ERR = true;
    renderStamp();
  }
}

// 화면 둘: 대시보드 · 집결장 전용. 왼쪽 위 메뉴에서 고르고 주소 # 뒤에 남긴다
function setView(v) {
  VIEW = v === "rally" ? "rally" : "dash";
  $("vDash").style.display = VIEW === "dash" ? "" : "none";
  $("vRally").style.display = VIEW === "rally" ? "" : "none";
  $("menuCur").textContent = tx(VIEW === "rally" ? "mRally" : "mDash");
  $("mDash").className = "item" + (VIEW === "dash" ? " on" : "");
  $("mRally").className = "item" + (VIEW === "rally" ? " on" : "");
  $("rallyNote").style.display = IS_ADMIN ? "none" : "";
  $("menu").style.display = "none";
  try { history.replaceState(null, "", location.pathname + location.search + (VIEW === "rally" ? "#rally" : "")); } catch (e) {}
}
$("menuBtn").addEventListener("click", () => { $("menu").style.display = "flex"; });
$("menuClose").addEventListener("click", () => { $("menu").style.display = "none"; });
$("menu").addEventListener("click", e => {
  if (e.target === $("menu")) { $("menu").style.display = "none"; return; }
  const b = e.target.closest("button.item");
  if (b) { setView(b.getAttribute("data-v")); window.scrollTo(0, 0); }
});

// 언어를 바꾸면 고정 글과 표를 그 언어로 다시 그린다. 고른 언어는 이 기기에 기억한다
function setLang(l) {
  LANG = I18N[l] ? l : "en";
  try { localStorage.setItem("k700lang", LANG); } catch (e) {}
  document.documentElement.lang = LANG === "zh" ? "zh-Hant" : LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = tx("title");
  $("langs").innerHTML = LANGS.map(k => '<button data-l="' + k + '"' + (k === LANG ? ' class="on"' : '') + '>' + I18N[k].name + '</button>').join("");
  [["tTitle", "title"], ["bSurvey", "bSurvey"], ["bTroops", "bTroops"], ["reload", "bReload"], ["hSlots", "hSlots"], ["hRally", "hRally"], ["dRally", "dRally"], ["hResp", "hResp"], ["hMissing", "hMissing"], ["dMissing", "dMissing"], ["hBad", "hBad"], ["dBad", "dBad"], ["bWar", "bWar"], ["hWar", "warTitle"], ["dWar", "warDesc"], ["sTable", "sTable"], ["hRep", "repTitle"], ["repCopy", "bCopy"], ["menuT", "menu"], ["mDash", "mDash"], ["mRally", "mRally"], ["rallyNote", "rallyNote"]].forEach(x => { $(x[0]).textContent = tx(x[1]); });
  ["warClose", "popClose", "menuClose", "repClose"].forEach(id => { $(id).title = tx("close"); });
  if ($("rep").style.display !== "none") openReport();
  $("menuCur").textContent = tx(VIEW === "rally" ? "mRally" : "mDash");
  $("fName").placeholder = "🔍 " + tx("findName");
  const fa = $("fAlly").value, fs = $("fSlot").value;
  $("fAlly").innerHTML = '<option value="">' + tx("fAllyAll") + '</option>' + ALLIES.map(a => '<option>' + esc(a) + '</option>').join("");
  $("fSlot").innerHTML = '<option value="">' + tx("fSlotAll") + '</option><option value="full">' + tx("fullJoin") + '</option>' + SLOTS.map((s, i) => '<option value="' + i + '">' + s[0] + '</option>').join("");
  $("fAlly").value = fa || ""; $("fSlot").value = fs || "";
  const keepTg = $("fTg").value, keepCamp = [0, 1, 2].map(k => ($("fCamp" + k) || {}).value);
  $("fTg").innerHTML = '<option value="">' + tx("fTgAll") + '</option>' + [8, 7, 6, 5, 4, 3, 2, 1].map(n => '<option value="' + n + '">' + (n === 8 ? "TG8" : tx("fTgMin", n)) + '</option>').join("");
  $("fTg").value = keepTg || "";
  $("fTroops").innerHTML = ["inf", "cav", "arc"].map((n, k) => '<div class="fgrp k' + k + '"><b>' + tx(n) + '</b><select id="fCamp' + k + '"><option value="">' + tx("fCampAll") + '</option>' +
    [8, 7, 6, 5, 4, 3, 2, 1].map(v => '<option value="' + v + '"' + (+keepCamp[k] === v ? ' selected' : '') + '>' + (v === 8 ? tx("fCampMin", 8).replace(/TG8.*/, "TG8") : tx("fCampMin", v)) + '</option>').join("") + '</select>' +
    '<span class="sub">' + tx("fGold") + '</span>' + [10, 11].map(v => '<button class="chip t' + v + (FTIER[k].has(v) ? ' on' : '') + '" data-t="' + k + '" data-v="' + v + '">T' + v + '</button>').join("") + '</div>').join("");
  $("fMystic").placeholder = tx("fMystic"); $("fReset").textContent = tx("fReset");
  renderStamp();
  if (LOADED_AT && !LOAD_ERR) { render(); renderAdmin(); }
  if ($("war").style.display !== "none") renderWar();
}
$("langs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setLang(b.getAttribute("data-l")); });

["fAlly", "fSlot", "fTg", "fTroops"].forEach(id => $(id).addEventListener("change", () => { PAGE = 0; render(); }));
$("fTroops").addEventListener("click", e => {
  const b = e.target.closest("button.chip");
  if (!b) return;
  const set = FTIER[+b.getAttribute("data-t")], v = +b.getAttribute("data-v");
  if (set.has(v)) set.delete(v); else set.add(v);
  b.classList.toggle("on", set.has(v));
  PAGE = 0; render();
});
["fName", "fMystic"].forEach(id => $(id).addEventListener("input", () => { PAGE = 0; render(); }));
$("fReset").addEventListener("click", () => {
  ["fAlly", "fSlot", "fName", "fTg", "fMystic", "fCamp0", "fCamp1", "fCamp2"].forEach(id => { $(id).value = ""; });
  FTIER.forEach(x => x.clear());
  [...document.querySelectorAll("#fTroops .chip")].forEach(b => b.classList.remove("on"));
  PAGE = 0; render();
});
// 설문 · 병사 정보 입력은 이 화면 위에 팝업으로 띄운다. 닫으면 명단을 다시 읽는다
const SURVEY_URL = "https://docs.google.com/forms/d/e/1FAIpQLScrbdptVwUimJm__NIvVjMpaIyJM4cDCQWe2SGEQr4Sc1WHfQ/viewform?embedded=true";
// 고른 언어로 팝업을 연다: 설문지는 화면 언어(hl)와 언어 문항을 미리 골라 두고, 병사 정보 화면은 lang 으로 넘긴다
const SURVEY_LANG = {ko: ["ko", "한국어 (Korea)"], en: ["en", "English"], zh: ["zh-TW", "繁體中文 (台灣·香港)"], ar: ["ar", "العربية (Arabic)"], tr: ["tr", "Türkçe (Turkish)"]};
const surveyUrl = () => { const v = SURVEY_LANG[LANG] || SURVEY_LANG.en; return SURVEY_URL + "&hl=" + v[0] + "&entry.293341731=" + encodeURIComponent(v[1]); };
function openPop(url, title) { $("hPop").textContent = title; $("popFrame").src = url; $("pop").style.display = "flex"; }
function closePop() {
  if ($("pop").style.display === "none") return;
  $("pop").style.display = "none"; $("popFrame").src = "about:blank";
  load();
}
$("bSurvey").addEventListener("click", e => { e.preventDefault(); openPop(surveyUrl(), tx("bSurvey")); });
$("bTroops").addEventListener("click", e => { e.preventDefault(); openPop("troops.html?embed=1&lang=" + LANG, tx("bTroops")); });
$("popClose").addEventListener("click", closePop);
$("pop").addEventListener("click", e => { if (e.target === $("pop")) closePop(); });
$("repClose").addEventListener("click", () => { $("rep").style.display = "none"; });
$("rep").addEventListener("click", e => { if (e.target === $("rep")) $("rep").style.display = "none"; });
$("repCopy").addEventListener("click", copyReport);
$("bWar").addEventListener("click", () => { $("war").style.display = "flex"; renderWar(); });
$("warClose").addEventListener("click", () => { $("war").style.display = "none"; });
$("war").addEventListener("click", e => { if (e.target === $("war")) $("war").style.display = "none"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("war").style.display = "none"; $("menu").style.display = "none"; $("rep").style.display = "none"; closePop(); } });
$("warBody").addEventListener("change", e => {
  const ta = e.target.getAttribute && e.target.getAttribute("data-ta");
  if (ta && MAPD && MAPD[ta]) { MAPD[ta].t = TOWERS[e.target.value] ? e.target.value : ""; MAP_DIRTY = true; renderWar(); return; }
  const a = e.target.getAttribute && e.target.getAttribute("data-a");
  if (!a || !MAPD || !MAPD[a] || e.target.tagName !== "SELECT") return;
  MAPD[a].h = +e.target.value || 0; MAP_DIRTY = true;
  renderWar();
});
$("warBody").addEventListener("input", e => {
  const el = e.target;
  if (el.id === "wBy") { if (!ME.n) try { localStorage.setItem("k700by", el.value.trim()); } catch (x) {} return; }
  const a = el.getAttribute && el.getAttribute("data-m");
  if (a && MAPD && MAPD[a]) { MAPD[a].m = el.value.slice(0, 40); MAP_DIRTY = true; }
});
$("warBody").addEventListener("click", e => { if (e.target.id === "wSave") saveMap(); });
$("sAlly").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  SLOT_ALLY = b.getAttribute("data-a") || "";
  renderChart();
});
$("pager").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  PAGE = +b.getAttribute("data-p") || 0;
  render();
});
$("reload").addEventListener("click", load);
$("rAlly").innerHTML = ALLIES.map(a => '<option>' + esc(a) + '</option>').join("");
$("rAlly").addEventListener("change", () => { renderAdmin(); renderRally(); });
// 「공격 배치」 · 「수비 배치」: 그 포메이션으로 다시 그린다. 관리자는 지금 고친 설정으로 계산한다
$("rally").addEventListener("click", e => {
  if (pickTab(e)) return;
  if (e.target.closest("button.repb")) { openReport(); return; }
  const b = e.target.closest("button.modeb");
  if (!b) return;
  RMODE = b.getAttribute("data-mode") === "def" ? "def" : "atk";
  const a = $("rAlly").value || ALLIES[0];
  if (IS_ADMIN && DRAFT && can(a)) {
    if (!boxOk(DRAFT.A[a])) { renderRally(); const m = $("rallyMsg"); if (m) m.textContent = tx("sumBlock"); return; }
    PLAN[a] = JSON.parse(JSON.stringify(DRAFT.A[a] || blank()));
  }
  renderRally();
  // 편성표는 단추 아래에 그려진다. 눌렀는데 아무 일도 없어 보이지 않게 알려 주고 그 자리로 내려간다
  const first = $("rally").querySelector(".card.leader"), m = $("rallyMsg");
  if (first) {
    if (m) { m.style.color = "var(--ok)"; m.textContent = tx("placed"); }
    try { first.scrollIntoView({behavior: "smooth", block: "start"}); } catch (x) {}
  }
});
$("respTable").addEventListener("click", e => {
  const b = e.target.closest("button.star");
  if (!b || !IS_ADMIN || !DRAFT) return;
  const p = DATA.find(x => x.key === b.getAttribute("data-key"));
  if (!p) return;
  const box = DRAFT.A[p.ally] || (DRAFT.A[p.ally] = blank());
  DIRTY[p.ally] = true;
  const k = box.leaders.findIndex(l => l.id === p.id);
  if (k >= 0) box.leaders.splice(k, 1); else box.leaders.push(newLeader(p.id));
  $("rAlly").value = p.ally;
  renderAdmin();
  render();
});
$("admin").addEventListener("input", e => {
  const el = e.target, v = +String(el.value).replace(/[^0-9]/g, "") || 0, cur = $("rAlly").value || ALLIES[0];
  if (el.id === "aBy") { if (!ME.n) try { localStorage.setItem("k700by", el.value.trim()); } catch (x) {} return; }
  DIRTY[cur] = true;
  if (el.id === "aDef") (DRAFT.A[cur] || (DRAFT.A[cur] = blank())).def = v;
  else if (el.dataset.f) {
    const l = leadersOf($("rAlly").value || ALLIES[0])[+el.dataset.k];
    if (!l) return;
    const k = +el.dataset.k, f = el.dataset.f;
    if (f === "cap") l.cap = v; else (f[0] === "d" ? l.d : l.r)[+f.slice(1)] = v;
    if ($("stNeed")) { const c = Math.max(0, +l.cap || 0), o = Math.min(MARCH[l.id] || +(DRAFT.A[cur] || {}).def || 100000, c); $("stOwn").textContent = fmt(o); $("stNeed").textContent = fmt(c - o); }
    if ($("nr" + k)) { $("nr" + k).textContent = needText(l, "atk"); $("nr" + k).className = needCls(l, "atk"); }
    if ($("nd" + k)) { $("nd" + k).textContent = needText(l, "def"); $("nd" + k).className = needCls(l, "def"); }
  } else return;
  renderRally();
});
const pickTab = e => {
  const t = e.target.closest("button.ltab");
  if (!t) return false;
  SELK[$("rAlly").value || ALLIES[0]] = +t.getAttribute("data-k") || 0;
  renderAdmin(); renderRally();
  return true;
};
$("admin").addEventListener("click", e => {
  if (pickTab(e)) return;
  if (e.target.closest("button.repb")) { openReport(); return; }
  if (e.target.id === "aReset") {
    const a = $("rAlly").value || ALLIES[0];
    if (!DRAFT || !can(a) || !confirm(tx("resetAsk", a))) return;
    const box = DRAFT.A[a] || (DRAFT.A[a] = blank());
    box.leaders = []; SELK[a] = 0; DIRTY[a] = true;
    PLAN[a] = JSON.parse(JSON.stringify(box));
    renderAdmin(); render();
    $("aMsg").textContent = tx("resetDone");
    return;
  }
  if (e.target.id === "aSave") { saveConfig(); return; }
  if (e.target.id === "aAdd") {
    const id = $("aPick").value, a = $("rAlly").value || ALLIES[0];
    if (!id || !DRAFT) return;
    const box = DRAFT.A[a] || (DRAFT.A[a] = blank());
    if (!box.leaders.some(l => l.id === id)) box.leaders.push(newLeader(id));
    SELK[a] = Math.max(0, box.leaders.findIndex(l => l.id === id));
    DIRTY[a] = true;
    renderAdmin(); render();
    return;
  }
  const up = e.target.closest("button.up");
  if (up) {
    const ls = leadersOf($("rAlly").value || ALLIES[0]), k = +up.getAttribute("data-up");
    if (k > 0 && ls[k]) { const x = ls[k]; ls[k] = ls[k - 1]; ls[k - 1] = x; SELK[$("rAlly").value || ALLIES[0]] = k - 1; DIRTY[$("rAlly").value || ALLIES[0]] = true; renderAdmin(); render(); }
    return;
  }
  const d = e.target.closest("button.del");
  if (!d) return;
  DIRTY[$("rAlly").value || ALLIES[0]] = true;
  leadersOf($("rAlly").value || ALLIES[0]).splice(+d.dataset.k, 1);
  renderAdmin();
  render();
});
(function () {
  let l = "";
  try { l = localStorage.getItem("k700lang") || ""; } catch (e) {}
  if (!I18N[l]) { const nav = (navigator.language || "en").toLowerCase(); l = LANGS.find(k => nav.indexOf(k) === 0) || "en"; }
  setLang(l);
})();
setView(location.hash === "#rally" ? "rally" : "dash");
initAdmin().then(() => { setView(VIEW); return load(); }, load);
setInterval(load, 60000);
</script>
