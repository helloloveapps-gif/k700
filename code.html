<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>성검 암호표</title>
<style>
:root{--bg:#f4efe2;--ink:#1b1208;--card:#fffaf0;--sub:#6b5a44;--red:#d6402b;--blue:#2457c5;--gold:#c9a227;--line:#1b1208}
@media (prefers-color-scheme:dark){:root{--bg:#14110c;--ink:#f1e8d6;--card:#1f1a12;--sub:#b3a184;--red:#ff6b52;--blue:#6d9bff;--gold:#e9c450;--line:#f1e8d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans KR","Malgun Gothic","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:22px;width:min(340px,100%);text-align:center;box-shadow:6px 6px 0 var(--line)}
#gate h1{margin:0 0 12px;font-size:22px}
#gate input{width:100%;font-size:22px;text-align:center;padding:10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);letter-spacing:.2em}
#gate button{margin-top:12px;width:100%;font-size:18px;font-weight:800;padding:10px;border:3px solid var(--line);border-radius:10px;background:var(--gold);color:#1b1208;cursor:pointer}
#gate .err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
header h1{margin:0;font-size:24px}
.lang{display:flex;gap:6px}
.lang button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
.lead{color:var(--sub);font-size:14px;margin:4px 0 14px}
h2{font-size:18px;margin:22px 0 10px;padding-bottom:4px;border-bottom:3px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.c{background:var(--card);border:2.5px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:4px 4px 0 var(--line)}
.c .w{font-size:30px;font-weight:900;line-height:1.1}
.c .r{font-size:13px;color:var(--sub);margin-top:2px;font-style:italic}
.c .m{margin-top:8px;font-size:16px;font-weight:700}
.c.red .w{color:var(--red)} .c.blue .w{color:var(--blue)}
.ex{background:var(--card);border:2.5px dashed var(--line);border-radius:12px;padding:12px 14px}
.ex div{padding:6px 0;border-bottom:1px solid rgba(127,127,127,.25)}
.ex div:last-child{border:0}
.ex b{font-size:20px}
.ex span{color:var(--sub);margin-left:8px}
.rule{font-size:14px;color:var(--sub);margin-top:6px}
@media print{#gate{display:none}.c,.ex{box-shadow:none}}
</style>
</head>
<body>
<div id="gate">
  <form id="gf">
    <h1>🔒</h1>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="password">
    <button type="submit">OK</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header><h1 id="t"></h1><div class="lang" id="lang"></div></header>
  <div class="lead" id="lead"></div>
  <div id="body"></div>
</div>
<script>
// 성검 리그 리딩 암호표(이박사님 11-15): 음성으로 「성소 가자」 대신 한국어 암호 낱말만 말한다. 링크는 메뉴에 없고, 비밀번호를 넣어야 보인다
const HASH = "71af0fdd2e7f62c1c351432a69fdf8f6579e9dce0c12c2b3af90f964540bdb83";   // 비밀번호 SHA-256
// 장소 · 행동 · 상황 — w: 암호(한국어로 말한다), r: 소리(로마자), ko/zh/en: 뜻
const D = {
  place: [
    {w: "김치", r: "gimchi", ko: "성소", zh: "聖所", en: "Sanctuary"},
    {w: "된장", r: "doenjang", ko: "수도원", zh: "修道院", en: "Abbey"},
    {w: "라면", r: "ramyeon", ko: "시계탑", zh: "鐘樓", en: "Bell tower"},
    {w: "만두", r: "mandu", ko: "마구간", zh: "皇家馬廄", en: "Royal stables"},
    {w: "불고기", r: "bulgogi", ko: "성검 제단", zh: "聖劍祭壇", en: "Sword altar"},
    {w: "비빔밥", r: "bibimbap", ko: "교화의 홀", zh: "教化之廳", en: "Hall of enlightenment"},
    {w: "떡볶이", r: "tteokbokki", ko: "용병 주둔지", zh: "傭兵營地", en: "Mercenary camp"},
    {w: "고구마", r: "goguma", ko: "땅굴", zh: "地道", en: "Tunnel"}
  ],
  side: [
    {w: "빨간", r: "ppalgan", ko: "적군 쪽 (장소 앞에)", zh: "敵方的（放在地點前）", en: "Enemy's (before a place)", cls: "red"},
    {w: "파란", r: "paran", ko: "아군 쪽 (장소 앞에)", zh: "我方的（放在地點前）", en: "Ours (before a place)", cls: "blue"},
    {w: "하나 · 둘", r: "hana · dul", ko: "1번 · 2번 (장소 뒤에)", zh: "1 號 · 2 號（放在地點後）", en: "No.1 · No.2 (after a place)"}
  ],
  act: [
    {w: "바다", r: "bada", ko: "집결 걸어라 · 공격", zh: "開集結 · 進攻", en: "Start rally · attack"},
    {w: "택시", r: "taeksi", ko: "그쪽으로 텔레포트", zh: "傳送過去", en: "Teleport there"},
    {w: "우산", r: "usan", ko: "수비 · 장비 교체", zh: "防守 · 換裝備", en: "Defend · swap gear"},
    {w: "산", r: "san", ko: "후퇴 · 빠져라", zh: "撤退", en: "Pull back"},
    {w: "커피", r: "keopi", ko: "대기 · 멈춰", zh: "待命 · 先停", en: "Hold · wait"},
    {w: "청소", r: "cheongso", ko: "회수조 출발(전리품 줍기)", zh: "回收組出發（撿補給）", en: "Recovery team go (loot)"},
    {w: "소풍", r: "sopung", ko: "채집조 땅굴 출발", zh: "採集組去地道", en: "Gatherers to tunnels"},
    {w: "도시락", r: "dosirak", ko: "치료 · 병사 회복", zh: "治療 · 回兵", en: "Heal troops"}
  ],
  sit: [
    {w: "호랑이", r: "horangi", ko: "적 1군(큰 집결) 보인다", zh: "看到敵方主力集結", en: "Enemy main rally spotted"},
    {w: "고양이", r: "goyangi", ko: "적 작은 부대 · 정찰", zh: "敵方小部隊 · 偵查", en: "Small enemy squad · scout"},
    {w: "불", r: "bul", ko: "우리 거점 공격받는 중", zh: "我方據點被打", en: "Our point under attack"},
    {w: "눈", r: "nun", ko: "거점 비어 있음 · 지금 가져가자", zh: "據點空著 · 現在拿", en: "Point is empty · take it now"},
    {w: "축하", r: "chukha", ko: "점령 성공", zh: "佔領成功", en: "Captured"},
    {w: "아이고", r: "aigo", ko: "뺏겼다", zh: "被搶走了", en: "We lost it"}
  ]
};
const H = {
  ko: {t: "🗝 성검 리딩 암호표", lead: "음성으로는 암호 낱말만 말한다. 어순: [빨간/파란] + [장소] + [하나/둘] + [행동]. 다른 사람에게 이 주소를 보내지 않는다.", place: "장소", side: "누구 쪽 · 몇 번", act: "행동", sit: "상황", ex: "이렇게 말한다", rule: "※ 암호는 한국어 그대로 말한다(번역 X). 대만 친구는 아래 로마자 소리로 알아듣는다."},
  zh: {t: "🗝 聖劍聯賽 指揮暗號表", lead: "語音只說暗號。順序：[빨간/파란] + [地點] + [하나/둘] + [動作]。不要把這個網址傳給別人。", place: "地點", side: "哪一方 · 幾號", act: "動作", sit: "狀況", ex: "這樣說", rule: "※ 暗號直接用韓語說（不翻譯）。看下面的羅馬拼音就知道怎麼念。"},
  en: {t: "🗝 Swordland lead code sheet", lead: "On voice, say only the code words. Order: [ppalgan/paran] + [place] + [hana/dul] + [action]. Don't share this link.", place: "Places", side: "Whose · which one", act: "Actions", sit: "Situations", ex: "Say it like this", rule: "※ Say codes in Korean as they are (no translation). Romanization is under each word."}
};
const EX = [
  ["빨간 김치 바다", {ko: "적군 성소 공격", zh: "進攻敵方聖所", en: "Attack enemy sanctuary"}],
  ["파란 된장 하나 우산", {ko: "아군 수도원 1번 수비 · 장비 교체", zh: "防守我方 1 號修道院 · 換裝備", en: "Defend our abbey No.1 · swap gear"}],
  ["불고기 택시", {ko: "성검 제단으로 텔레포트", zh: "傳送到聖劍祭壇", en: "Teleport to the sword altar"}],
  ["호랑이 · 김치 불", {ko: "적 1군 보인다 · 우리 성소 공격받는 중", zh: "看到敵方主力 · 我方聖所被打", en: "Enemy main rally · our sanctuary under attack"}],
  ["청소", {ko: "회수조 출발", zh: "回收組出發", en: "Recovery team go"}],
  ["고구마 소풍", {ko: "채집조 땅굴로", zh: "採集組去地道", en: "Gatherers to tunnels"}]
];
let L = "ko";
try { L = localStorage.getItem("code_l") || (navigator.language.startsWith("zh") ? "zh" : navigator.language.startsWith("ko") ? "ko" : "en"); } catch (e) {}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function draw() {
  const h = H[L];
  document.documentElement.lang = L === "zh" ? "zh-Hant" : L;
  document.getElementById("t").textContent = h.t;
  document.getElementById("lead").textContent = h.lead;
  document.getElementById("lang").innerHTML = [["ko", "한국어"], ["zh", "中文"], ["en", "EN"]].map(([k, v]) => '<button data-l="' + k + '"' + (k === L ? ' class="on"' : '') + '>' + v + '</button>').join("");
  const card = x => '<div class="c ' + (x.cls || "") + '"><div class="w">' + esc(x.w) + '</div><div class="r">' + esc(x.r) + '</div><div class="m">' + esc(x[L]) + '</div></div>';
  let b = "";
  for (const k of ["place", "side", "act", "sit"]) b += '<h2>' + h[k] + '</h2><div class="grid">' + D[k].map(card).join("") + '</div>';
  b += '<h2>' + h.ex + '</h2><div class="ex">' + EX.map(([w, m]) => '<div><b>' + esc(w) + '</b><span>' + esc(m[L]) + '</span></div>').join("") + '</div><div class="rule">' + h.rule + '</div>';
  document.getElementById("body").innerHTML = b;
}
document.getElementById("lang").onclick = e => { const b = e.target.closest("button"); if (!b) return; L = b.dataset.l; try { localStorage.setItem("code_l", L); } catch (x) {} draw(); };
async function sha(t) { const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function open_() { document.getElementById("gate").hidden = true; document.getElementById("gate").style.display = "none"; document.getElementById("app").hidden = false; draw(); }
document.getElementById("gf").onsubmit = async e => {
  e.preventDefault();
  if (await sha(document.getElementById("pw").value.trim()) === HASH) { try { sessionStorage.setItem("code_ok", "1"); } catch (x) {} open_(); }
  else document.getElementById("err").textContent = "✕";
};
try { if (sessionStorage.getItem("code_ok") === "1") open_(); } catch (e) {}
</script>
</body>
</html>
